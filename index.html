function drawVisualLayout() {
    if (!fieldW) return; 
    push(); noStroke(); let stripes = 9; let sh = fieldH / stripes;
    let lvl = isCampaign ? CAMPAIGN_LEVELS[currentLevel] : null;

    let topGoalW = goalW; let botGoalW = goalW;
    if (isCampaign && lvl && lvl.scenario === 'striker') {
        topGoalW = goalW * 0.55;
        botGoalW = goalW * 1.45;
    }

    fill('rgba(255, 255, 255, 0.28)'); 
    let topGoalX = fieldX + fieldW/2 - topGoalW/2;
    let topGoalY = fieldY - goalH;
    let botGoalX = fieldX + fieldW/2 - botGoalW/2;
    let botGoalY = fieldY + fieldH;

    rect(topGoalX, topGoalY, topGoalW, goalH); 
    rect(botGoalX, botGoalY, botGoalW, goalH);

    let scaleFactor = (fieldW && fieldW > 0) ? (fieldW / 330) : 1;
    let markStroke = max(2.5, 5.5 * scaleFactor);
    let borderStroke = max(3.5, 8.5 * scaleFactor);
    let netStroke = max(1.0, 1.8 * scaleFactor);
    let diagStep = max(8, 16 * scaleFactor);
    let postDiameter = max(4, 8.5 * scaleFactor);

    // Minimalist goal net mesh (diagonal cross pattern)
    push();
    stroke('rgba(255, 255, 255, 0.9)'); // Crisp white net lines
    strokeWeight(netStroke);

    // Top goal net crosses
    drawingContext.save();
    drawingContext.beginPath();
    drawingContext.rect(topGoalX, topGoalY, topGoalW, goalH);
    drawingContext.clip();
    drawingContext.beginPath();
    for (let offset = -goalH - topGoalW; offset < topGoalW + goalH; offset += diagStep) {
        drawingContext.moveTo(topGoalX + offset, topGoalY);
        drawingContext.lineTo(topGoalX + offset + goalH + topGoalW, topGoalY + goalH + topGoalW);
        drawingContext.moveTo(topGoalX + offset, topGoalY + goalH + topGoalW);
        drawingContext.lineTo(topGoalX + offset + goalH + topGoalW, topGoalY);
    }
    drawingContext.stroke();
    drawingContext.restore();

    // Bottom goal net crosses
    drawingContext.save();
    drawingContext.beginPath();
    drawingContext.rect(botGoalX, botGoalY, botGoalW, goalH);
    drawingContext.clip();
    drawingContext.beginPath();
    for (let offset = -goalH - botGoalW; offset < botGoalW + goalH; offset += diagStep) {
        drawingContext.moveTo(botGoalX + offset, botGoalY);
        drawingContext.lineTo(botGoalX + offset + goalH + botGoalW, botGoalY + goalH + botGoalW);
        drawingContext.moveTo(botGoalX + offset, botGoalY + goalH + botGoalW);
        drawingContext.lineTo(botGoalX + offset + goalH + botGoalW, botGoalY);
    }
    drawingContext.stroke();
    drawingContext.restore();
    pop();
    
    let isLiveInGameReplay = isReplaying && (replayReturnState === null || replayReturnState === 'GAME' || replayReturnState === 'GAME_WIN');

    if (isLiveInGameReplay && replaySource && replaySource.length > 0) {
        let maxFrames = max(1, replaySource.length - 1);
        let progressRatio = constrain(replayFrameIdx / maxFrames, 0, 1);
        let fillH = fieldH * progressRatio;

        // Base pitch: Bright green (matching light lawn color)
        fill(FIELD_COLOR_1);
        rect(fieldX, fieldY, fieldW, fieldH);

        // Replay progress fill: Dark green (matching dark lawn stripes)
        if (fillH > 0) {
            fill(FIELD_COLOR_2);
            rect(fieldX, fieldY, fieldW, fillH);
        }

        // Crisp progress line boundary dividing dark green fill from bright green remainder
        if (fillH > 0 && fillH < fieldH) {
            push();
            stroke('rgba(255, 255, 255, 0.45)');
            strokeWeight(1.5);
            line(fieldX, fieldY + fillH, fieldX + fieldW, fieldY + fillH);
            pop();
        }
    } else {
        for(let i=0; i<stripes; i++) { fill(i % 2 === 0 ? FIELD_COLOR_1 : FIELD_COLOR_2); rect(fieldX, fieldY + i*sh, fieldW, sh); }
    }
    
    // Pitch markings (dynamic stroke thickness)
    stroke(BORDER_COLOR); strokeWeight(markStroke); noFill();
    let penaltyW = fieldW * 0.567; let penaltyH = fieldH * 0.11;
    rect(fieldX + fieldW/2 - penaltyW/2, fieldY, penaltyW, penaltyH); 
    rect(fieldX + fieldW/2 - penaltyW/2, fieldY + fieldH - penaltyH, penaltyW, penaltyH);
    
    let arcSize = fieldW * 0.22;
    arc(fieldX + fieldW/2, fieldY + penaltyH, arcSize, arcSize, 0, PI);
    arc(fieldX + fieldW/2, fieldY + fieldH - penaltyH, arcSize, arcSize, PI, TWO_PI);
    
    line(fieldX, fieldY + fieldH/2, fieldX + fieldW, fieldY + fieldH/2); 
    ellipse(fieldX + fieldW/2, fieldY + fieldH/2, fieldW * 0.258); 
    
    // Goal nets outlines
    rect(fieldX + fieldW/2 - topGoalW/2, fieldY - goalH, topGoalW, goalH); 
    rect(fieldX + fieldW/2 - botGoalW/2, fieldY + fieldH, botGoalW, goalH); 
    
    // Goal lines across top and bottom goal openings
    strokeWeight(markStroke);
    line(fieldX + fieldW/2 - topGoalW/2, fieldY, fieldX + fieldW/2 + topGoalW/2, fieldY);
    line(fieldX + fieldW/2 - botGoalW/2, fieldY + fieldH, fieldX + fieldW/2 + botGoalW/2, fieldY + fieldH);

    // Dynamic outer perimeter walls around field
    strokeWeight(borderStroke);
    strokeJoin(MITER);
    strokeCap(SQUARE);
    noFill();

    let pOff = max(1, borderStroke * 0.25);

    // Left side perimeter
    beginShape();
    vertex(fieldX + fieldW/2 - topGoalW/2, fieldY - pOff);
    vertex(fieldX - pOff, fieldY - pOff);
    vertex(fieldX - pOff, fieldY + fieldH + pOff);
    vertex(fieldX + fieldW/2 - botGoalW/2, fieldY + fieldH + pOff);
    endShape();

    // Right side perimeter
    beginShape();
    vertex(fieldX + fieldW/2 + topGoalW/2, fieldY - pOff);
    vertex(fieldX + fieldW + pOff, fieldY - pOff);
    vertex(fieldX + fieldW + pOff, fieldY + fieldH + pOff);
    vertex(fieldX + fieldW/2 + botGoalW/2, fieldY + fieldH + pOff);
    endShape(); 
    
    // Render prominent visible goal posts
    let postsList = [
        { x: fieldX + fieldW/2 - topGoalW/2, y: fieldY },
        { x: fieldX + fieldW/2 + topGoalW/2, y: fieldY },
        { x: fieldX + fieldW/2 - botGoalW/2, y: fieldY + fieldH },
        { x: fieldX + fieldW/2 + botGoalW/2, y: fieldY + fieldH }
    ];
    for (let p of postsList) {
        fill('#ffffff'); noStroke();
        ellipse(p.x, p.y, postDiameter);
        fill(255, 180);
        ellipse(p.x, p.y, postDiameter * 0.5);
    }

    if (isKickOffActive && !isReplaying) {
        // Subtle, elegant dashed barrier line across goal mouths
        stroke('rgba(255, 255, 255, 0.5)');
        strokeWeight(2.5);
        drawingContext.setLineDash([4, 4]);
        
        line(fieldX + fieldW/2 - topGoalW/2, fieldY, fieldX + fieldW/2 + topGoalW/2, fieldY);
        line(fieldX + fieldW/2 - botGoalW/2, fieldY + fieldH, fieldX + fieldW/2 + botGoalW/2, fieldY + fieldH);
        
        drawingContext.setLineDash([]);
    }
    pop();
}

function getCornerThreshold() {
    let scale = (fieldW && fieldW > 0) ? (fieldW / 330) : 1;
    return 80 * scale;
}

function isBallInCorner() {
    let ball = entities.find(e => e.isBall);
    if (!ball) return false;
    let threshold = getCornerThreshold(); 
    if (dist(ball.p.x, ball.p.y, fieldX, fieldY) < threshold) return true;
    if (dist(ball.p.x, ball.p.y, fieldX + fieldW, fieldY) < threshold) return true;
    if (dist(ball.p.x, ball.p.y, fieldX, fieldY + fieldH) < threshold) return true;
    if (dist(ball.p.x, ball.p.y, fieldX + fieldW, fieldY + fieldH) < threshold) return true;
    return false;
}

function triggerDropBall() {
    let ball = entities.find(e => e.isBall);
    if (!ball) return;
    
    let centerX = fieldX + fieldW / 2;
    let centerY = fieldY + fieldH / 2;
    
    isDropBallAnimating = true;
    dropBallAnimProgress = 0;
    dropBallStartPos = ball.p.copy();
    dropBallTargetPos = createVector(centerX, centerY);
    ball.v.set(0, 0);
    
    createSparks(ball.p.x, ball.p.y, '#ff6600', 18);
    createSparks(ball.p.x, ball.p.y, '#ffffff', 12);
    
    disputedOverlayText = "СПОРНЫЙ МЯЧ!";
    disputedTextTimer = 100;
    shakeAmount = 6;
}

function updateDropBallAnimation() {
    if (!isDropBallAnimating) return;
    
    let ball = entities.find(e => e.isBall);
    if (!ball) {
        isDropBallAnimating = false;
        return;
    }
    
    dropBallAnimProgress += 0.035;
    let t = dropBallAnimProgress;
    if (t > 1) t = 1;
    
    // Smooth easeOutCubic curve
    let easeT = 1 - Math.pow(1 - t, 3);
    
    ball.p.x = lerp(dropBallStartPos.x, dropBallTargetPos.x, easeT);
    ball.p.y = lerp(dropBallStartPos.y, dropBallTargetPos.y, easeT);
    ball.v.set(0, 0);
    
    if (frameCount % 2 === 0) {
        createSparks(ball.p.x, ball.p.y, '#ff7700', 3);
    }
    
    if (t >= 1) {
        isDropBallAnimating = false;
        let centerX = dropBallTargetPos.x;
        let centerY = dropBallTargetPos.y;
        ball.p.set(centerX, centerY);
        ball.v.set(0, 0);
        
        for (let e of entities) {
            if (!e.isBall) {
                let dCenter = dist(e.p.x, e.p.y, centerX, centerY);
                let minDist = (e.d + ball.d) / 2 + 6;
                if (dCenter < minDist) {
                    let pushDir = p5.Vector.sub(e.p, createVector(centerX, centerY));
                    if (pushDir.mag() < 0.1) pushDir = p5.Vector.random2D();
                    pushDir.normalize().mult(minDist);
                    e.p.set(centerX + pushDir.x, centerY + pushDir.y);
                }
            }
        }
        
        playSound('over', 0.6);
        createSparks(centerX, centerY, '#ff6600', 25);
        createSparks(centerX, centerY, '#ffffff', 15);
        cornerTurns = 0;
        wasBallInCornerBeforeShot = false;
    }
}

function drawCornerIndicators() {
    if (!enableCoinToss) return;
    let ball = entities.find(e => e.isBall);
    if (!ball) return;
    
    let threshold = getCornerThreshold();
    let corners = [
        { x: fieldX, y: fieldY, start: 0, end: HALF_PI },
        { x: fieldX + fieldW, y: fieldY, start: HALF_PI, end: PI },
        { x: fieldX, y: fieldY + fieldH, start: 1.5 * PI, end: TWO_PI },
        { x: fieldX + fieldW, y: fieldY + fieldH, start: PI, end: 1.5 * PI }
    ];
    
    for (let c of corners) {
        let d = dist(ball.p.x, ball.p.y, c.x, c.y);
        if (d < threshold) {
            push();
            let pulse = 160 + 60 * sin(frameCount * 0.1);
            let midAngle = (c.start + c.end) / 2;

            // Half 1: c.start to midAngle (disappears after 1 move in corner)
            // Half 2: midAngle to c.end (remains during 1st move, disappears after 2nd move)

            // 1) Render Half 1 if cornerTurns === 0 (0 moves spent in corner so far)
            if (cornerTurns === 0) {
                fill(255, 110, 0, 95 + 25 * sin(frameCount * 0.1));
                stroke(255, 150, 0, pulse);
                strokeWeight(2.5);
                beginShape();
                vertex(c.x, c.y);
                for (let a = c.start; a <= midAngle + 0.01; a += 0.04) {
                    vertex(c.x + cos(a) * threshold, c.y + sin(a) * threshold);
                }
                vertex(c.x, c.y);
                endShape(CLOSE);
            }

            // 2) Render Half 2 if cornerTurns < 2 (remains when 1 move spent in corner)
            if (cornerTurns < 2) {
                fill(255, 110, 0, 95 + 25 * sin(frameCount * 0.1));
                stroke(255, 150, 0, pulse);
                strokeWeight(2.5);
                beginShape();
                vertex(c.x, c.y);
                for (let a = midAngle; a <= c.end + 0.01; a += 0.04) {
                    vertex(c.x + cos(a) * threshold, c.y + sin(a) * threshold);
                }
                vertex(c.x, c.y);
                endShape(CLOSE);
            }

            // 3) Render crisp dividing line between halves and outer arc outline
            if (cornerTurns < 2) {
                stroke(255, 230, 160, pulse);
                strokeWeight(3);
                line(c.x, c.y, c.x + cos(midAngle) * threshold, c.y + sin(midAngle) * threshold);

                stroke(255, 180, 0, pulse);
                strokeWeight(3.5);
                noFill();
                let activeStart = (cornerTurns === 0) ? c.start : midAngle;
                let activeEnd = c.end;
                let steps = 10;
                let stepAngle = (activeEnd - activeStart) / steps;
                for (let i = 0; i < steps; i += 2) {
                    arc(c.x, c.y, threshold * 2, threshold * 2, activeStart + i * stepAngle, activeStart + (i + 1) * stepAngle);
                }
            }
            pop();
        }
    }
}

function drawFieldScore() {
    push(); 
    let goalLeftX = fieldX + fieldW/2 - goalW/2; 
    let earWidth = goalLeftX - fieldX; 
    let leftEarCenterX = fieldX + earWidth / 2; 
    let rightEarCenterX = (fieldX + fieldW) - earWidth / 2; 
    let scoreScale = (fieldW && fieldW > 0) ? (fieldW / 330) : 1;
    let ballSize = max(6, min(14, 12 * scoreScale));
    let maxAllowedSpacing = (earWidth * 0.82) / max(1, maxGoalsToWin);
    let spacing = min(16 * scoreScale, maxAllowedSpacing);
    let topY = fieldY - goalH + 15;
    for (let i = 0; i < maxGoalsToWin; i++) {
        fill(i < p2Goals ? PLAYER2_COLOR : '#444444'); noStroke(); ellipse(leftEarCenterX + (i - (maxGoalsToWin-1)/2) * spacing, topY, ballSize);
        fill(i < p1Goals ? PLAYER1_COLOR : '#444444'); ellipse(rightEarCenterX + (i - (maxGoalsToWin-1)/2) * spacing, topY, ballSize);
    }
    let bottomY = fieldY + fieldH + goalH - 15;
    for (let i = 0; i < maxGoalsToWin; i++) {
        fill(i < p1Goals ? PLAYER1_COLOR : '#444444'); noStroke(); ellipse(leftEarCenterX + (i - (maxGoalsToWin-1)/2) * spacing, bottomY, ballSize);
        fill(i < p2Goals ? PLAYER2_COLOR : '#444444'); ellipse(rightEarCenterX + (i - (maxGoalsToWin-1)/2) * spacing, bottomY, ballSize);
    }

    if (isTournament && tourTimeLimitMinutes > 0 && p1TimeRemaining >= 0 && p2TimeRemaining >= 0) {
        drawTimerPill(leftEarCenterX, topY + 24, p2TimeRemaining, PLAYER2_COLOR, currentTurn === PLAYER2_COLOR);
        drawTimerPill(rightEarCenterX, topY + 24, p1TimeRemaining, PLAYER1_COLOR, currentTurn === PLAYER1_COLOR);
        
        drawTimerPill(leftEarCenterX, bottomY - 24, p1TimeRemaining, PLAYER1_COLOR, currentTurn === PLAYER1_COLOR);
        drawTimerPill(rightEarCenterX, bottomY - 24, p2TimeRemaining, PLAYER2_COLOR, currentTurn === PLAYER2_COLOR);
    }

    if (isTournament && tourMatchDurationMinutes > 0 && matchTimeRemaining >= 0) {
        drawMatchTimerPill(width/2, topY, matchTimeRemaining, isGoldenGoalActive);
        drawMatchTimerPill(width/2, bottomY, matchTimeRemaining, isGoldenGoalActive);
    }

    if (isTournament && turnShotClock >= 0 && !matchWinner && !isGoalCelebrating && !isResettingPositions && !isEvacuating) {
        drawShotClockBar(width/2, topY + 16, turnShotClock, currentTurn);
        drawShotClockBar(width/2, bottomY - 16, turnShotClock, currentTurn);
    }
    pop();
}

function drawShotClockBar(cx, cy, remainingTime, teamColor) {
    push();
    rectMode(CENTER);
    noStroke();
    // Background track
    fill('#1c2128');
    rect(cx, cy, 60, 4, 2);
    
    // Fill width
    let fillW = map(constrain(remainingTime, 0, 15), 0, 15, 0, 60);
    
    // Select color based on remaining time
    let barColor = color(teamColor);
    if (remainingTime < 5) {
        let pulse = sin(frameCount * 0.3) > 0;
        barColor = pulse ? color('#ff7b72') : color('#f2cc60');
    }
    
    fill(barColor);
    rect(cx - (60 - fillW)/2, cy, fillW, 4, 2);
    
    // Visual text countdown if low on time
    if (remainingTime < 10) {
        fill(barColor);
        textAlign(CENTER, CENTER);
        textSize(8.5);
        textStyle(BOLD);
        text(ceil(remainingTime), cx, cy - 8);
    }
    pop();
}

function drawMatchTimerPill(cx, cy, remainingTime, isGoldenGoal) {
    push();
    rectMode(CENTER);
    textAlign(CENTER, CENTER);
    textFont('monospace, system-ui');
    
    let w = 72;
    let h = 22;
    
    if (isGoldenGoal) {
        let pulse = 150 + 105 * sin(frameCount * 0.2);
        fill('#161b22');
        stroke(255, 193, 7, pulse);
        strokeWeight(2.0);
    } else {
        fill('#0d1117');
        stroke('#30363d');
        strokeWeight(1);
    }
    
    rect(cx, cy, w, h, 6);
    
    noStroke();
    if (isGoldenGoal) {
        fill('#ffc107');
        textStyle(BOLD);
        textSize(9.5);
        text("GG", cx, cy - 0.5);
    } else {
        fill('#ffffff');
        textStyle(BOLD);
        textSize(11);
        
        if (remainingTime < 10) {
            let pulseRed = sin(frameCount * 0.35) > 0;
            if (pulseRed) {
                fill('#ff7b72');
            }
        }
        text(formatTime(remainingTime), cx, cy - 0.5);
    }
    pop();
}

function drawGoalOverlay() {

            enableCoinToss: onlineMatchCoinToss,
            showCollisionBtn: onlineMatchCollisionBtn
        });

}

function initSocket() {
    if (socket) return;
    
    if (typeof io === 'undefined') {
        onlineRoomError = "Socket.io не загружен!";
        return;
    }
    
    socket = io();
    
    socket.on('roomCreated', (roomState) => {
        onlineRoomId = roomState.id;
        onlineMyRole = 'PLAYER1';
        onlineP1Connected = true;
        onlineP2Connected = false;
        onlineP1Ready = false;
        onlineP2Ready = false;
        onlineRoomError = '';
        gameState = 'ONLINE_LOBBY';
        p1ColorIdx = roomState.p1.colorIdx;
        if (roomState.settings) {
            onlineMatchGoals = roomState.settings.maxGoalsToWin;
            onlineMatchCoinToss = roomState.settings.enableCoinToss;
            onlineMatchCollisionBtn = roomState.settings.showCollisionBtn;
        }
    });
    
    socket.on('roomJoined', (roomState) => {
        onlineRoomId = roomState.id;
        if (onlineMyRole !== 'PLAYER1') {
            onlineMyRole = 'PLAYER2';
        }
        onlineP1Connected = true;
        onlineP2Connected = true;
        onlineP1Ready = roomState.p1.ready;
        onlineP2Ready = roomState.p2 ? roomState.p2.ready : false;
        onlineRoomError = '';
        gameState = 'ONLINE_LOBBY';
        p1ColorIdx = roomState.p1.colorIdx;
        if (roomState.p2) {
            p2ColorIdx = roomState.p2.colorIdx;
            if (p1ColorIdx === p2ColorIdx) {
                if (onlineMyRole === 'PLAYER2') {
                    p2ColorIdx = getNextUnlockedColorIdx(p2ColorIdx, 1, p1ColorIdx);
                    if (socket) socket.emit('changeColor', { room: onlineRoomId, colorIdx: p2ColorIdx, role: 'PLAYER2' });
                }
            }
        }
        if (roomState.settings) {
            onlineMatchGoals = roomState.settings.maxGoalsToWin;
            onlineMatchCoinToss = roomState.settings.enableCoinToss;
            onlineMatchCollisionBtn = roomState.settings.showCollisionBtn;
        }
        PLAYER1_COLOR = TEAM_COLORS[p1ColorIdx].value;
        PLAYER2_COLOR = TEAM_COLORS[p2ColorIdx].value;
    });

    socket.on('settingsUpdated', (data) => {
        if (data) {
            onlineMatchGoals = data.maxGoalsToWin;
            onlineMatchCoinToss = data.enableCoinToss;
            onlineMatchCollisionBtn = data.showCollisionBtn;
        }
    });
    
    socket.on('colorChanged', (data) => {
        p1ColorIdx = data.p1ColorIdx;
        p2ColorIdx = data.p2ColorIdx;
        if (p1ColorIdx === p2ColorIdx) {
            if (onlineMyRole === 'PLAYER2') {
                p2ColorIdx = getNextUnlockedColorIdx(p2ColorIdx, 1, p1ColorIdx);
                if (socket) socket.emit('changeColor', { room: onlineRoomId, colorIdx: p2ColorIdx, role: 'PLAYER2' });
            } else if (onlineMyRole === 'PLAYER1') {
                p1ColorIdx = getNextUnlockedColorIdx(p1ColorIdx, 1, p2ColorIdx);
                if (socket) socket.emit('changeColor', { room: onlineRoomId, colorIdx: p1ColorIdx, role: 'PLAYER1' });
            }
        }
        PLAYER1_COLOR = TEAM_COLORS[p1ColorIdx].value;
        PLAYER2_COLOR = TEAM_COLORS[p2ColorIdx].value;
    });
    
    socket.on('readyChanged', (data) => {
        onlineP1Ready = data.p1Ready;
        onlineP2Ready = data.p2Ready;
    });
    
    socket.on('matchStart', (data) => {
        p1ColorIdx = data.p1ColorIdx;
        p2ColorIdx = data.p2ColorIdx;
        if (data.settings) {
            onlineMatchGoals = data.settings.maxGoalsToWin;
            onlineMatchCoinToss = data.settings.enableCoinToss;
            onlineMatchCollisionBtn = data.settings.showCollisionBtn;
        }
        if (data.p1CustomPositions && data.p1CustomPositions.length > 0) {
            p1CustomPositions = data.p1CustomPositions;
            p1Saved = true;
        } else {
            p1CustomPositions = [];
            p1Saved = false;
        }
        if (data.p2CustomPositions && data.p2CustomPositions.length > 0) {
            p2CustomPositions = data.p2CustomPositions;
            p2Saved = true;
        } else {
            p2CustomPositions = [];
            p2Saved = false;
        }
        isOnline = true;
        isVsBot = false;
        isCampaign = false;
        isTournament = false;
        
        startGameMatch();
    });
    
    socket.on('opponentShoot', (data) => {
        let ent = entities[data.index];
        if (ent) {
            let force = createVector(data.forceX * fieldW, data.forceY * fieldH);
            ent.v.add(force);
            
            triggerVibrate(25);
            turnShotClock = 15;
            currentTurnIdleTime = 0;
            currentTurn = (currentTurn === PLAYER1_COLOR) ? PLAYER2_COLOR : PLAYER1_COLOR;
            turnSwitchedThisRoll = true;
        }
    });
    
    socket.on('syncPositions', (data) => {
        if (data.positions && data.positions.length === entities.length) {
            for (let i = 0; i < entities.length; i++) {
                entities[i].p.x = fieldX + data.positions[i].x * fieldW;
                entities[i].p.y = fieldY + data.positions[i].y * fieldH;
                entities[i].v.set(0, 0);
            }
        }
    });
    
    socket.on('opponentGoalScored', (data) => {
        if (isGoalCelebrating || matchWinner) return;
        
        for (let e of entities) {
            e.v.set(0, 0);
        }
        
        p1Goals = data.p1Goals;
        p2Goals = data.p2Goals;
        
        goalOverlayText = data.isAutoGoal ? 'АВТОГОЛ!' : 'ГОЛ!';
        
        triggerVibrate(60);
        let ballEntity = entities.find(e => e.isBall);
        let ballX = ballEntity ? ballEntity.p.x : (fieldX + fieldW / 2);
        let isTopGoal = (data.scoringTeam === PLAYER1_COLOR);
        createGoalBurstParticles(ballX, isTopGoal ? fieldY : (fieldY + fieldH), data.scoringTeam, isTopGoal);
        playSound('goal', 0.85);
        
        postGoalFramesToRecord = 30;
        pendingGoalInfo = { scoringTeam: data.scoringTeam, nextTurnTeam: data.nextTurnTeam, isAutoGoal: data.isAutoGoal };
        
        startGoalCelebrationPhase(data.scoringTeam, data.nextTurnTeam, isTopGoal);
    });
    
    socket.on('rematchTriggered', () => {
        onlineP1Ready = false;
        onlineP2Ready = false;
        isOnline = true;
        gameState = 'ONLINE_LOBBY';
        entities = [];
    });
    
    socket.on('opponentDisconnected', () => {
        if (gameState === 'ONLINE_LOBBY' || gameState === 'ONLINE_SETTINGS') {
            onlineP2Connected = false;
            onlineP2Ready = false;
            onlineRoomError = 'Соперник отключился!';
            if (gameState === 'ONLINE_SETTINGS') {
                gameState = 'ONLINE_LOBBY';
            }
        } else if (gameState === 'GAME') {
            onlineOpponentDisconnected = true;
            if (onlineMyRole === 'PLAYER1') {
                triggerWin(TEAM_COLORS[p1ColorIdx].name);
            } else {
                triggerWin(TEAM_COLORS[p2ColorIdx].name);
            }
        }
    });
    
    socket.on('errorMsg', (msg) => {
        onlineRoomError = msg;
    });
}

function disconnectSocket() {
    if (socket) {
        socket.disconnect();
        socket = null;
    }
    isOnline = false;
    onlineRoomId = '';
    onlineMyRole = null;
    onlineP1Connected = false;
    onlineP2Connected = false;
    onlineP1Ready = false;
    onlineP2Ready = false;
    onlineInputRoomCode = '';
    onlineRoomError = '';
    onlineOpponentDisconnected = false;
}

function drawWinOverlay() {
    push(); textAlign(CENTER, CENTER); textFont('Arial, sans-serif'); textStyle(BOLD);
    textSize(40); fill(255); stroke(0); strokeWeight(8);
    let winText = `ПОБЕДА:\n${matchWinner}!`;
    if(isCampaign) winText = (p1Goals > p2Goals) ? "УРОВЕНЬ ПРОЙДЕН!" : "ВЫ ПРОИГРАЛИ!";
    if(isOnline && onlineOpponentDisconnected) {
        winText = "СОПЕРНИК ВЫШЕЛ!\nТЕХНИЧЕСКАЯ ПОБЕДА!";
    }
    text(winText, width / 2, height * 0.43);
    pop();
}
// Этот код принудительно убирает лишние отступы при запуске на телефоне
window.addEventListener('load', () => {
    setTimeout(() => {
        window.scrollTo(0, 1);
        if (typeof windowResized === 'function') {
            windowResized();
        }
    }, 300);
});

function windowResized() {
    if (windowWidth > windowHeight) {
        return; 
    }
    resizeCanvas(windowWidth, windowHeight); 
    calculateFieldMetrics(); 
}

function initMatchStartTurnSequence() {
    let startsPlayer1;
    if (isOnline) {
        let roomSeed = 0;
        if (onlineRoomId) {
            for (let i = 0; i < onlineRoomId.length; i++) {
                roomSeed += onlineRoomId.charCodeAt(i);
            }
        }
        startsPlayer1 = ((p1ColorIdx + p2ColorIdx + roomSeed) % 2 === 0);
    } else {
        startsPlayer1 = (random() < 0.5);
    }
    
    coinTossStartingTeam = startsPlayer1 ? PLAYER1_COLOR : PLAYER2_COLOR;
    isCoinTossActive = true;
    coinTossTimer = 0;
    coinTossDuration = 120;
    coinTossScale = 0;
    coinTossWinnerRevealed = false;
    
    resetFieldDirect(coinTossStartingTeam);
}

function drawCoinTossOverlay() {
    if (!isCoinTossActive) return;

    coinTossTimer++;

    // Dark backdrop overlay across screen
    push();
    rectMode(CORNER);
    fill(0, 210);
    noStroke();
    rect(0, 0, width, height);

    let cx = width / 2;
    let cy = height / 2;

    // Spin mathematics
    let spinPhaseDuration = 85;
    let spinProgress = constrain(coinTossTimer / spinPhaseDuration, 0, 1);

    let numRevolutions = 6;
    let targetAngle = numRevolutions * TWO_PI;

    let easeOutSpin = 1 - Math.pow(1 - spinProgress, 3.2);
    let currentAngle = easeOutSpin * targetAngle;

    // Sound effect on half-spins
    let halfSpinsCurrent = Math.floor(currentAngle / Math.PI);
    let halfSpinsPrev = Math.floor((currentAngle - 0.2) / Math.PI);
    if (spinProgress < 1.0 && halfSpinsCurrent > halfSpinsPrev && coinTossTimer < spinPhaseDuration - 5) {
        playSound('click', 0.35);
    }

    // Trigger reveal sound when chip stops
    if (spinProgress >= 1.0 && !coinTossWinnerRevealed) {
        coinTossWinnerRevealed = true;
        playSound('over', 0.9);
        triggerVibrate(40);
    }

    // Determine color: switches every half turn as it spins, landing solidly on coinTossStartingTeam
    let otherTeamColor = (coinTossStartingTeam === PLAYER1_COLOR) ? PLAYER2_COLOR : PLAYER1_COLOR;
    let halfTurnsRemaining = Math.floor((targetAngle - currentAngle) / Math.PI);
    let currentColor = (halfTurnsRemaining % 2 === 0) ? coinTossStartingTeam : otherTeamColor;

    push();
    translate(cx, cy);

    // Dark glass card container behind the coin so it stands out clearly
    rectMode(CENTER);
    fill(0, 90);
    noStroke();
    rect(0, 6, 165, 165, 24);

    fill('rgba(15, 20, 28, 0.94)');
    stroke('rgba(88, 166, 255, 0.25)');
    strokeWeight(1.5);
    rect(0, 0, 165, 165, 24);

    let chipD = 82; // Full game chip diameter

    // Glow orbit ring when landed on winner
    if (spinProgress >= 1.0) {
        let pulse = 1 + 0.08 * Math.sin(frameCount * 0.2);
        let auraCol = color(coinTossStartingTeam);
        auraCol.setAlpha(160);
        stroke(auraCol);
        strokeWeight(3.5);
        noFill();
        ellipse(0, 0, chipD * 1.35 * pulse);
    }

    // Shadow under the chip
    fill(0, 80);
    noStroke();
    ellipse(2, 4, chipD * 0.95, chipD * 0.95);

    // Draw full game chip rotating clockwise around its center
    push();
    rotate(currentAngle);
    
    let isP1 = (currentColor === PLAYER1_COLOR);
    let tossSkin = isP1 ? p1ChipSkin : p2ChipSkin;
    
    if (tossSkin === 0) {
        // Classic Skin
        stroke(0);
        strokeWeight(max(2.0, chipD * 0.12));
        fill(currentColor);
        ellipse(0, 0, chipD);
        fill(255);
        noStroke();
        drawStar(0, 0, chipD * 0.15, chipD * 0.32, 5);
    } else if (tossSkin === 1) {
        // Neon Glow Skin
        stroke(currentColor);
        strokeWeight(max(3.0, chipD * 0.16));
        fill(0, 180);
        ellipse(0, 0, chipD);
        stroke(255);
        strokeWeight(max(1.0, chipD * 0.05));
        noFill();
        ellipse(0, 0, chipD * 0.7);
        let pSize = chipD * (0.2 + 0.04 * sin(frameCount * 0.15));
        fill(currentColor);
        noStroke();
        ellipse(0, 0, pSize);
    } else {
        // Cyber Tech Skin
        stroke(45, 55, 72);
        strokeWeight(max(1.5, chipD * 0.08));
        fill('#0f141c');
        ellipse(0, 0, chipD);
        stroke(currentColor);
        strokeWeight(max(1.5, chipD * 0.07));
        let numTicks = 8;
        for (let i = 0; i < numTicks; i++) {
            let a = i * (TWO_PI / numTicks);
            line(cos(a) * chipD * 0.38, sin(a) * chipD * 0.38, cos(a) * chipD * 0.48, sin(a) * chipD * 0.48);
        }
        fill(currentColor);
        noStroke();
        ellipse(0, 0, chipD * 0.4);
        stroke(0, 150);
        strokeWeight(max(1.5, chipD * 0.06));
        noFill();
        ellipse(0, 0, chipD * 0.25);
    }
    pop();

    pop(); // end translate cx, cy
    pop(); // end overlay push

    if (coinTossTimer >= coinTossDuration) {
        isCoinTossActive = false;
        coinTossWinnerRevealed = false;
    }
}
