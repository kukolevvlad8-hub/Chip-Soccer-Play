    <script>
        let erudaEnabled = localStorage.getItem('erudaEnabled') === 'true';
        if (erudaEnabled && window.eruda) {
            try { eruda.init(); } catch(e) {}
        }
        function toggleEruda(enable) {
            erudaEnabled = enable;
            localStorage.setItem('erudaEnabled', erudaEnabled);
            if (window.eruda) {
                if (erudaEnabled) {
                    try { eruda.init(); } catch(e) {}
                    if (eruda._entry) eruda._entry.show();
                } else {
                    if (eruda._entry) eruda._entry.hide();
                    try { eruda.hide(); } catch(e) {}
                    try { eruda.destroy(); } catch(e) {}
                }
            }
        }
    </script>

function saveCampaignProgress() {
    try {
        localStorage.setItem('camp_highest_unlocked', campaignHighestUnlocked);
        localStorage.setItem('camp_stars', JSON.stringify(campaignStars));
    } catch(e) {
        console.error("Local storage not supported or failed to save campaign progress.", e);
    }
}

function loadCampaignProgress() {
    try {
        let storedUnlocked = localStorage.getItem('camp_highest_unlocked');
        if (storedUnlocked !== null) {
            campaignHighestUnlocked = parseInt(storedUnlocked);
        } else {
            campaignHighestUnlocked = 0;
        }
        let storedStars = localStorage.getItem('camp_stars');
        if (storedStars !== null) {
            campaignStars = JSON.parse(storedStars);
        } else {
            campaignStars = Array(CAMPAIGN_LEVELS.length).fill(0);
        }
    } catch(e) {
        console.error("Local storage error loading campaign progress.", e);
        campaignHighestUnlocked = 0;
        campaignStars = Array(CAMPAIGN_LEVELS.length).fill(0);
    }
}

function setCampaignLevelStars(lvlIdx, starsCount) {
    if (lvlIdx >= 0 && lvlIdx < CAMPAIGN_LEVELS.length) {
        if (!campaignStars || campaignStars.length === 0) {
            campaignStars = Array(CAMPAIGN_LEVELS.length).fill(0);
        }
        if (starsCount > (campaignStars[lvlIdx] || 0)) {
            campaignStars[lvlIdx] = starsCount;
            saveCampaignProgress();
        }
    }
}

function getCampaignLevelStars(lvlIdx) {
    if (!campaignStars || campaignStars.length === 0) {
        return 0;
    }
    return campaignStars[lvlIdx] || 0;
}

function getCampaignTotalStars() {
    let totalStars = 0;
    for (let i = 0; i < CAMPAIGN_LEVELS.length; i++) {
        totalStars += getCampaignLevelStars(i);
    }
    return totalStars;
}

function isColorLocked(idx) {
    let col = TEAM_COLORS[idx];
    if (col && col.reqStars) {
        return getCampaignTotalStars() < col.reqStars;
    }
    return false;
}

function getNextUnlockedColorIdx(currentIdx, direction, excludeIdx = -1) {
    let steps = 0;
    let idx = currentIdx;
    let total = getCampaignTotalStars();
    
    do {
        idx = (idx + direction + TEAM_COLORS.length) % TEAM_COLORS.length;
        if (idx === excludeIdx) continue;
        let col = TEAM_COLORS[idx];
        if (!col.reqStars || total >= col.reqStars) {
            return idx;
        }
        steps++;
    } while (steps < TEAM_COLORS.length * 2);
    
    return currentIdx;
}

function getChipAnchor(chip) {
    if (!chip) return null;
    let anchor = chip.p.copy();
    let refW = (typeof fieldW !== 'undefined' && fieldW > 0) ? fieldW : 330;
    let margin = refW * 0.24;
    let shift = refW * 0.48;
    
    if (chip.p.x < fieldX + margin) {
        anchor.x = fieldX + shift;
    } else if (chip.p.x > fieldX + fieldW - margin) {
        anchor.x = fieldX + fieldW - shift;
    }
    
    if (chip.p.y < fieldY + margin) {
        anchor.y = fieldY + shift;
    } else if (chip.p.y > fieldY + fieldH - margin) {
        anchor.y = fieldY + fieldH - shift;
    }
    
    return anchor;
}

function getTeamAbbreviation(name, colorHex) {
    if (colorHex) {
        let hexLower = colorHex.toLowerCase();
        if (COLOR_TO_ABBR[hexLower]) return COLOR_TO_ABBR[hexLower];
    }
    if (!name) return "---";
    let trimmed = name.trim();
    if (TEAM_ABBREVIATIONS[trimmed]) {
        return TEAM_ABBREVIATIONS[trimmed];
    }
    for (let key in TEAM_ABBREVIATIONS) {
        if (key.toLowerCase() === trimmed.toLowerCase()) {
            return TEAM_ABBREVIATIONS[key];
        }
    }
    
    let upper = trimmed.toUpperCase();
    if (COLOR_NAME_TO_ABBR[upper]) return COLOR_NAME_TO_ABBR[upper];
    for (let k in COLOR_NAME_TO_ABBR) {
        if (upper.startsWith(k)) return COLOR_NAME_TO_ABBR[k];
    }

    if (upper.includes("ASTERIA")) return "AST";
    
    let words = upper.split(/[\s-]+/).filter(w => w.length > 0);
    if (words.length >= 3) {
        return (words[0][0] + words[1][0] + words[2][0]).substring(0, 3);
    } else if (words.length === 2) {
        if (words[0].length >= 2) {
            return words[0].substring(0, 2) + words[1][0];
        }
        return (words[0] + words[1]).substring(0, 3);
    } else {
        return upper.substring(0, 3);
    }
}

function getFastRgb(c) {
    if (!c) return { r: 255, g: 255, b: 255 };
    if (typeof c === 'object' && c.r !== undefined) return c;
    if (typeof c === 'string' && c.startsWith('#')) {
        let hex = c.slice(1);
        if (hex.length === 3) hex = hex.split('').map(x => x + x).join('');
        let num = parseInt(hex, 16);
        return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }
    return { r: 255, g: 255, b: 255 };
}

// Функция вибрации с защитой от тормозов iOS Safari
function triggerVibrate(ms) {
    if (typeof vibrationEnabled !== 'undefined' && vibrationEnabled && navigator && typeof navigator.vibrate === 'function') {
        try { 
            let now = (typeof millis === 'function') ? millis() : Date.now();
            if (now - lastVibrationTime > 100) {
                lastVibrationTime = now;
                navigator.vibrate(ms); 
            }
        } catch(e) {}
    }
}

function getAudioContext() {
    if (!audioCtx) {
        let AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
            audioCtx = new AudioContextClass();
        }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
    return audioCtx;
}

function initAudio() {
    if (audioInitialized) return; 
    audioInitialized = true;
    
    let ctx = getAudioContext();
    const soundFiles = {
        'ball_shot':    'ball_shot.mp3',
        'ball_wall':    'chip_bounce.mp3',
        'chip_bounce':  'chip_bounce.mp3',
        'collide_chip': 'chip_bounce.mp3',
        'score':        'score.mp3',
        'over':         'over.mp3',
        'click':        'click.mp3'
    };

    for (let key in soundFiles) {
        gameSounds[key] = new Audio(soundFiles[key]);
        gameSounds[key].preload = 'auto';
    }

    if (ctx) {
        for (let key in soundFiles) {
            let url = soundFiles[key];
            fetch(url)
                .then(res => res.arrayBuffer())
                .then(buf => ctx.decodeAudioData(buf))
                .then(decoded => {
                    audioBuffers[key] = decoded;
                })
                .catch(() => {});
        }
    }
}

function playSynthSound(type, volume) {
    let ctx = getAudioContext();
    if (!ctx) return;
    try {
        let now = ctx.currentTime;
        let osc = ctx.createOscillator();
        let gain = ctx.createGain();
        let safeVol = constrain(volume, 0, 1) * 0.35;

        if (type === 'ball_shot' || type === 'collide_chip') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(45, now + 0.07);
            gain.gain.setValueAtTime(safeVol, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.07);
        } else if (type === 'ball_wall' || type === 'chip_bounce') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(260, now);
            osc.frequency.exponentialRampToValueAtTime(65, now + 0.05);
            gain.gain.setValueAtTime(safeVol, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.05);
        } else if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(550, now);
            osc.frequency.exponentialRampToValueAtTime(120, now + 0.02);
            gain.gain.setValueAtTime(safeVol * 0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.02);
        }
    } catch(e) {}
}

function playSound(type, volume = 1.0) {
    try {
        if (typeof soundEnabled !== 'undefined' && !soundEnabled) return;
        initAudio(); 

        let soundKey = type;
        if (type === 'hit' || type === 'ball_hit') soundKey = 'ball_shot';
        else if (type === 'wall') soundKey = 'ball_wall';
        else if (type === 'chips_hit' || type === 'chip_hit' || type === 'collide_chip') soundKey = 'collide_chip';
        else if (type === 'chip_wall' || type === 'chip_bounce') soundKey = 'chip_bounce';
        else if (type === 'goal' || type === 'goal_cheer') soundKey = 'score';

        let safeVolume = constrain(volume, 0.0, 1.0);

        // 1. Web Audio API playback if decoded buffer exists
        let ctx = getAudioContext();
        if (ctx && audioBuffers[soundKey]) {
            let source = ctx.createBufferSource();
            source.buffer = audioBuffers[soundKey];
            let gain = ctx.createGain();
            gain.gain.value = safeVolume;
            source.connect(gain);
            gain.connect(ctx.destination);
            source.start(0);
            return;
        }

        // 2. HTML5 Audio element fallback (plays actual .mp3 files like click.mp3)
        if (gameSounds && gameSounds[soundKey]) {
            let orig = gameSounds[soundKey];
            let clone = orig.cloneNode(true);
            clone.volume = safeVolume;
            let p = clone.play();
            if (p !== undefined) p.catch(() => {});
            return;
        }

        // 3. Web Audio synthesized sound fallback as last resort
        if (ctx && (soundKey === 'ball_shot' || soundKey === 'ball_wall' || soundKey === 'collide_chip' || soundKey === 'chip_bounce' || soundKey === 'click')) {
            playSynthSound(soundKey, safeVolume);
            return;
        }
    } catch (globalSoundError) {
        console.error("Ошибка в playSound:", globalSoundError);
    }
}

function drawStar(x, y, radius1, radius2, npoints) {
    let angle = TWO_PI / npoints;
    let halfAngle = angle / 2.0;
    beginShape();
    for (let a = -HALF_PI; a < TWO_PI - HALF_PI; a += angle) {
        let sx = x + cos(a) * radius2;
        let sy = y + sin(a) * radius2;
        vertex(sx, sy);
        sx = x + cos(a + halfAngle) * radius1;
        sy = y + sin(a + halfAngle) * radius1;
        vertex(sx, sy);
    }
    endShape(CLOSE);
}

function updateLevelModifiers() {
    activeModifiers = [];
    goalW = defaultGoalW; 
    if (!isCampaign || !fieldW) return;

    let lvl = CAMPAIGN_LEVELS[currentLevel];
    if (!lvl) return;

    for (let i = 0; i < (lvl.sandCount || 0); i++) {
        let randX = fieldX + random(60, fieldW - 140);
        let randY = fieldY + random(60, fieldH - 140);
        activeModifiers.push({
            x: randX, y: randY, w: random(70, 100), h: random(70, 100),
            type: 'mud', color: 'rgba(139, 69, 19, 0.32)', label: '░',
            forceX: 0, forceY: 0
        });
    }

    for (let i = 0; i < (lvl.iceCount || 0); i++) {
        let randX = fieldX + random(60, fieldW - 140);
        let randY = fieldY + random(60, fieldH - 140);
        activeModifiers.push({
            x: randX, y: randY, w: random(80, 110), h: random(80, 110),
            type: 'ice', color: 'rgba(0, 255, 255, 0.25)', label: '',
            forceX: 0, forceY: 0
        });
    }

    let isRedWind = (lvl.mod === 'fast_ball' || lvl.mod === 'chaos');
    let windColor = isRedWind ? 'rgba(255, 50, 50, 0.35)' : 'rgba(0, 191, 255, 0.32)';
    
    for (let i = 0; i < (lvl.windCount || 0); i++) {
        let randX = fieldX + random(60, fieldW - 140);
        let randY = fieldY + random(60, fieldH - 140);
        let angle = random(TWO_PI);
        let fx = cos(angle) * (isRedWind ? 0.28 : 0.16); 
        let fy = sin(angle) * (isRedWind ? 0.28 : 0.16);
        let lbl = '→';
        if (abs(fx) > abs(fy)) { lbl = fx > 0 ? '→' : '←'; } else { lbl = fy > 0 ? '↓' : '↑'; }

        activeModifiers.push({
            x: randX, y: randY, w: random(80, 110), h: random(80, 110),
            type: 'wind', color: windColor, label: lbl,
            forceX: fx, forceY: fy
        });
    }
}

function drawModifiers() {
    if (!isCampaign || activeModifiers.length === 0 || isEditingTactic) return;
    push();
    activeModifiers.forEach(zone => {
        noStroke();
        fill(zone.color);
        rect(zone.x, zone.y, zone.w, zone.h, 10);
        if (zone.color.includes('255, 50')) fill(255, 0, 0, 180); else fill(255, 130);
        textSize(24); textAlign(CENTER, CENTER);
        text(zone.label, zone.x + zone.w / 2, zone.y + zone.h / 2);

    pop();
}

class Entity {
    constructor(x, y, d, color, isBall) {
        this.p = createVector(x, y); 
        this.v = createVector(0, 0); 
        this.d = d;                   
        this.color = color;
        this.isBall = isBall;
        let refW = (typeof fieldW !== 'undefined' && fieldW > 0) ? fieldW : 330;
        this.mass = isBall ? 1.0 : (d > refW * 0.13 ? 12.0 : 6.0); 
        this.trail = [];
        this.spawnScale = 0;
        this.angle = (typeof TWO_PI !== 'undefined') ? random(TWO_PI) : Math.random() * Math.PI * 2;
        this.angularVel = 0;
        
        let centerPitchX = (typeof fieldX !== 'undefined') ? (fieldX + fieldW / 2) : width / 2;
        let centerPitchY = (typeof fieldY !== 'undefined') ? (fieldY + fieldH / 2) : height / 2;
        let dFromCenter = dist(x, y, centerPitchX, centerPitchY);
        this.spawnDelay = map(dFromCenter, 0, 420, 0, 24); 
    }

    update() {
        if (isResettingPositions || isEvacuating || matchWinner || isGoalCelebrating) return;

        this.p.add(this.v);
        this.angle += this.angularVel;
        if (this.v.mag() > 0.08) {
            let rollDir = (this.v.x * 0.02 - this.v.y * 0.01);
            this.angularVel += rollDir * 0.03;
        }
        this.angularVel *= 0.94;
        let currentFriction = FRICTION;
        let lvl = isCampaign ? CAMPAIGN_LEVELS[currentLevel] : null;

        if (isCampaign && lvl) {
            if (lvl.scenario === 'slalom' || lvl.scenario === 'chaos_arena') {
                currentFriction = 0.982; // Nerfed background ice friction (was 0.995) to be playable!
            }
        }

        if (isCampaign) {
            activeModifiers.forEach(zone => {
                if (this.p.x > zone.x && this.p.x < zone.x + zone.w &&
                    this.p.y > zone.y && this.p.y < zone.y + zone.h) {
                    if (zone.type === 'mud') currentFriction = FRICTION * 0.90; 
                    if (zone.type === 'ice') currentFriction = 0.985; // Nerfed ice zone friction (was 0.998) to be playable!
                    if (zone.type === 'wind') { this.v.x += zone.forceX; this.v.y += zone.forceY; }
                }
            });
        }

        // Apply campaign safety dampening if a turn is rolling for too long (prevent forever sliding/spinning)
        if (isCampaign && campaignRollingFrameCounter > 210) {
            currentFriction *= 0.88;
        }

        this.v.mult(currentFriction); 
        if (this.v.mag() < 0.08) this.v.set(0, 0);

        // Spark special effects for unlocked team colors (premium black strokes aura)
        let isExclusiveColor = (this.color === '#00ffcc' || this.color === '#ffd700' || this.color === '#d500f9');
        if (isExclusiveColor && !this.isBall) {
            if (this.v.mag() > 0.8) {
                if (frameCount % 3 === 0) {
                    particles.push(new BlackStrokeParticle(this));
                }
            } else {
                // Subtle idle aura
                if (frameCount % 18 === 0 && random() < 0.45) {
                    particles.push(new BlackStrokeParticle(this));
                }
            }
        }

        if (this.isBall) {
            if (this.v.mag() > 0.5) { ballTrail.push({ x: this.p.x, y: this.p.y, alpha: 180 }); }
            if (ballTrail.length > 15) ballTrail.shift();
        } else {
            if (this.v.mag() > 0.8) {
                this.trail.push({ x: this.p.x, y: this.p.y, alpha: 180 });
            }
            if (this.trail.length > 12) this.trail.shift();
            for (let i = this.trail.length - 1; i >= 0; i--) {
                this.trail[i].alpha -= 8;
            }
            this.trail = this.trail.filter(pt => pt.alpha > 0);
        }

        let r = this.d / 2;
        let goalX = fieldX + fieldW/2;
        
        let currentTopGoalW = goalW;
        let currentBotGoalW = goalW;
        if (isCampaign && lvl) {
            if (lvl.scenario === 'striker') {
                currentTopGoalW = goalW * 0.55;
                currentBotGoalW = goalW * 1.45;
            }
        }

        let leftPostXTop = goalX - currentTopGoalW/2;
        let rightPostXTop = goalX + currentTopGoalW/2;
        let leftPostXBot = goalX - currentBotGoalW/2;
        let rightPostXBot = goalX + currentBotGoalW/2;

        if (this.p.y < fieldY) {
            if (this.p.x > leftPostXTop && this.p.x < rightPostXTop) {
                if (isKickOffActive && this.isBall) {
                    this.p.y = fieldY + r;
                    this.v.y *= -0.8;
                    triggerVibrate(20);
                    playSound('wall', abs(this.v.y)/5);
                    createSparks(this.p.x, this.p.y, '#0096ff', abs(this.v.y)*2.5);
                } else if (this.p.y < fieldY - goalH + r) { this.p.y = fieldY - goalH + r; this.v.y *= -0.8; }
            }
        }
        if (this.p.y > fieldY + fieldH) {
            if (this.p.x > leftPostXBot && this.p.x < rightPostXBot) {
                if (isKickOffActive && this.isBall) {
                    this.p.y = fieldY + fieldH - r;
                    this.v.y *= -0.8;
                    triggerVibrate(20);
                    playSound('wall', abs(this.v.y)/5);
                    createSparks(this.p.x, this.p.y, '#0096ff', abs(this.v.y)*2.5);
                } else if (this.p.y > fieldY + fieldH + goalH - r) { this.p.y = fieldY + fieldH + goalH - r; this.v.y *= -0.8; }
            }
        }

        if (this.p.y < fieldY && this.p.y > fieldY - goalH) {
            if (this.p.x > leftPostXTop - r && this.p.x < rightPostXTop + r) {
                if (this.p.x < leftPostXTop + r) { this.p.x = leftPostXTop + r; this.v.x *= -0.8; playSound(this.isBall ? 'wall' : 'chip_wall', abs(this.v.x)/5); }
                if (this.p.x > rightPostXTop - r) { this.p.x = rightPostXTop - r; this.v.x *= -0.8; playSound(this.isBall ? 'wall' : 'chip_wall', abs(this.v.x)/5); }
            }
        }
        if (this.p.y > fieldY + fieldH && this.p.y < fieldY + fieldH + goalH) {
            if (this.p.x > leftPostXBot - r && this.p.x < rightPostXBot + r) {
                if (this.p.x < leftPostXBot + r) { this.p.x = leftPostXBot + r; this.v.x *= -0.8; playSound(this.isBall ? 'wall' : 'chip_wall', abs(this.v.x)/5); }
                if (this.p.x > rightPostXBot - r) { this.p.x = rightPostXBot - r; this.v.x *= -0.8; playSound(this.isBall ? 'wall' : 'chip_wall', abs(this.v.x)/5); }
            }
        }

        let collidedWithPost = false;
        if (this.p.y < fieldY + 15 && this.p.y > fieldY - 15) {
            let dLeft = dist(this.p.x, this.p.y, leftPostXTop, fieldY);
            if (dLeft < r + 4) {
                let norm = createVector(this.p.x - leftPostXTop, this.p.y - fieldY).normalize();
                this.p.set(leftPostXTop + norm.x * (r + 4.5), fieldY + norm.y * (r + 4.5));
                this.v.reflect(norm).mult(0.8);
                playSound(this.isBall ? 'wall' : 'chip_wall', this.v.mag() / 5);
                collidedWithPost = true;
            }
            if (!collidedWithPost) {
                let dRight = dist(this.p.x, this.p.y, rightPostXTop, fieldY);
                if (dRight < r + 4) {
                    let norm = createVector(this.p.x - rightPostXTop, this.p.y - fieldY).normalize();
                    this.p.set(rightPostXTop + norm.x * (r + 4.5), fieldY + norm.y * (r + 4.5));
                    this.v.reflect(norm).mult(0.8);
                    playSound(this.isBall ? 'wall' : 'chip_wall', this.v.mag() / 5);
                    collidedWithPost = true;
                }
            }
        }
        let collidedWithPostBot = false;
        if (this.p.y > fieldY + fieldH - 15 && this.p.y < fieldY + fieldH + 15) {
            let dLeft = dist(this.p.x, this.p.y, leftPostXBot, fieldY + fieldH);
            if (dLeft < r + 4) {
                let norm = createVector(this.p.x - leftPostXBot, this.p.y - (fieldY + fieldH)).normalize();
                this.p.set(leftPostXBot + norm.x * (r + 4.5), (fieldY + fieldH) + norm.y * (r + 4.5));
                this.v.reflect(norm).mult(0.8);
                playSound(this.isBall ? 'wall' : 'chip_wall', this.v.mag() / 5);
                collidedWithPostBot = true;
            }
            if (!collidedWithPostBot) {
                let dRight = dist(this.p.x, this.p.y, rightPostXBot, fieldY + fieldH);
                if (dRight < r + 4) {
                    let norm = createVector(this.p.x - rightPostXBot, this.p.y - (fieldY + fieldH)).normalize();
                    this.p.set(rightPostXBot + norm.x * (r + 4.5), (fieldY + fieldH) + norm.y * (r + 4.5));
                    this.v.reflect(norm).mult(0.8);
                    playSound(this.isBall ? 'wall' : 'chip_wall', this.v.mag() / 5);
                    collidedWithPostBot = true;
                }
            }
        }

        let triggerWallSound = (vol) => {
            if (vol < 0.12) return;
            let nowW = millis();
            if (nowW - lastWallSoundTime > 40) {
                lastWallSoundTime = nowW;
                playSound(this.isBall ? 'wall' : 'chip_wall', vol);
            }
        };

        if (this.p.x < fieldX + r) { this.p.x = fieldX + r; this.v.x *= -0.8; this.angularVel += -this.v.y * 0.03; triggerVibrate(15); triggerWallSound(abs(this.v.x)/5); if (particles.length < 120) createSparks(this.p.x, this.p.y, BORDER_COLOR, abs(this.v.x)*2); }
        if (this.p.x > fieldX + fieldW - r) { this.p.x = fieldX + fieldW - r; this.v.x *= -0.8; this.angularVel += this.v.y * 0.03; triggerVibrate(15); triggerWallSound(abs(this.v.x)/5); if (particles.length < 120) createSparks(this.p.x, this.p.y, BORDER_COLOR, abs(this.v.x)*2); }
        if (!collidedWithPost && this.p.y < fieldY + r) {
            if (this.p.x < leftPostXTop || this.p.x > rightPostXTop) { this.p.y = fieldY + r; this.v.y *= -0.8; this.angularVel += -this.v.x * 0.03; triggerVibrate(15); triggerWallSound(abs(this.v.y)/5); if (particles.length < 120) createSparks(this.p.x, this.p.y, BORDER_COLOR, abs(this.v.y)*2); }
        }
        if (!collidedWithPostBot && this.p.y > fieldY + fieldH - r) {
            if (this.p.x < leftPostXBot || this.p.x > rightPostXBot) { this.p.y = fieldY + fieldH - r; this.v.y *= -0.8; this.angularVel += this.v.x * 0.03; triggerVibrate(15); triggerWallSound(abs(this.v.y)/5); if (particles.length < 120) createSparks(this.p.x, this.p.y, BORDER_COLOR, abs(this.v.y)*2); }
        }
    }

    display(isAnyEntityMoving) {
        if (globalSpawnAlpha === 255) {
            this.spawnScale = 1.0;
        } else {
            let framesSinceSpawnStart = globalSpawnAlpha / 5.5;
            if (framesSinceSpawnStart > this.spawnDelay) {
                let t = (framesSinceSpawnStart - this.spawnDelay) / 22; 
                if (t > 1) t = 1;
                if (t < 0) t = 0;
                this.spawnScale = t === 1 ? 1 : 1 - Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TWO_PI / 3));
            } else {
                this.spawnScale = 0;
            }
        }

        if (this.spawnScale <= 0.01) return; 

        push();
        let currentEntityAlpha = this.isBall ? 255 : (isEditingTactic ? 255 : globalSpawnAlpha);
        let lvl = isCampaign ? CAMPAIGN_LEVELS[currentLevel] : null;

        if (this.isBall) {
            fill(0, map(currentEntityAlpha, 0, 255, 0, 75)); noStroke();
            ellipse(this.p.x + 3 * this.spawnScale, this.p.y + 4 * this.spawnScale, this.d * this.spawnScale); 

            if (this.v.mag() === 0 && !isResettingPositions && !isEvacuating && !matchWinner && !isEditingTactic && !isGoalCelebrating) ballAuraAlpha = lerp(ballAuraAlpha, 110, 0.05);
            else ballAuraAlpha = 0; 
            if (ballAuraAlpha > 0) {
                fill(255, 255, 190, ballAuraAlpha * this.spawnScale); 
                ellipse(this.p.x, this.p.y, this.d * 2.2 * this.spawnScale);
            }
            
            push(); 
            translate(this.p.x, this.p.y); 
            rotate(this.angle);
            scale(this.spawnScale);
            
            if (ballSkin === 0) {
                // Classic Skin
                fill(255); stroke(40); 
                strokeWeight(max(1.5, this.d * 0.16)); ellipse(0, 0, this.d); 
                
                let dotSize = (this.d / 2) * 0.9; 
                let offset = (this.d / 2) - dotSize / 2 - 0.5; 
                fill(40); 
                noStroke(); ellipse(-offset, 0, dotSize); ellipse(offset, 0, dotSize);  
            } else if (ballSkin === 1) {
                // Fireball Skin
                let pulse = 1.0 + 0.05 * sin(frameCount * 0.2);
                stroke(248, 81, 73, currentEntityAlpha); 
                strokeWeight(max(2.0, this.d * 0.15));
                fill(255, 123, 114); 
                ellipse(0, 0, this.d * pulse);

                fill(242, 190, 34); 
                noStroke();
                ellipse(0, 0, this.d * 0.65);

                fill(139, 20, 20); 
                ellipse(-this.d * 0.15, -this.d * 0.1, this.d * 0.2);
                ellipse(this.d * 0.15, this.d * 0.1, this.d * 0.2);
                ellipse(0, -this.d * 0.15, this.d * 0.18);
            } else {
                // Energy Core Skin
                let epulse = 1.0 + 0.04 * cos(frameCount * 0.25);
                stroke(88, 166, 255, currentEntityAlpha); 
                strokeWeight(max(2.0, this.d * 0.18));
                fill('#0d1117'); 
                ellipse(0, 0, this.d * epulse);

                fill('#00ffcc');
                noStroke();
                ellipse(0, 0, this.d * 0.45);

                stroke(255, currentEntityAlpha);
                strokeWeight(1.5);
                line(-this.d * 0.35, 0, -this.d * 0.15, 0);
                line(this.d * 0.15, 0, this.d * 0.35, 0);
                line(0, -this.d * 0.35, 0, -this.d * 0.15);
                line(0, this.d * 0.15, 0, this.d * 0.35);
            }
            pop();
        } else {
            push();
            for (let i = 0; i < this.trail.length; i++) {
                let pt = this.trail[i];
                let size = map(i, 0, this.trail.length - 1, this.d * 0.25, this.d * 0.85) * this.spawnScale;
                let alpha = map(i, 0, this.trail.length - 1, 5, pt.alpha);
                
                let c = color(this.color);
                c.setAlpha(alpha * 0.35);
                
                if (this.color === '#00ffcc') {
                    // Matrix Jade Square Trail
                    rectMode(CENTER);
                    fill(c);
                    noStroke();
                    rect(pt.x, pt.y, size, size, 3);
                } else if (this.color === '#ffd700') {
                    // Gold Crystal Star Trail
                    fill(c);
                    noStroke();
                    drawStar(pt.x, pt.y, size * 0.22, size * 0.45, 5);
                } else if (this.color === '#d500f9') {
                    // Dark Matter Void Ring Trail
                    noFill();
                    stroke(c);
                    strokeWeight(map(i, 0, this.trail.length - 1, max(1, this.d * 0.03), max(2.5, this.d * 0.085)));
                    ellipse(pt.x, pt.y, size);
                } else {
                    // Standard Trail
                    noStroke();
                    fill(c);
                    ellipse(pt.x, pt.y, size);
                }
            }
            pop();

            fill(0, map(currentEntityAlpha, 0, 255, 0, 80)); noStroke();
            ellipse(this.p.x + 4 * this.spawnScale, this.p.y + 5 * this.spawnScale, this.d * this.spawnScale);

            if (!isAnyEntityMoving && this.color === currentTurn && orbitAlpha > 0.5 && !isEditingTactic && !isResettingPositions && !isEvacuating && !matchWinner && !isGoalCelebrating && !isCoinTossActive) {
                let orbitCol = color(0, map(orbitAlpha, 0, 255, 0, currentEntityAlpha));
                if (this.color === '#00ffcc') orbitCol = color(0, 255, 204, map(orbitAlpha, 0, 255, 0, currentEntityAlpha));
                else if (this.color === '#ffd700') orbitCol = color(255, 215, 0, map(orbitAlpha, 0, 255, 0, currentEntityAlpha));
                else if (this.color === '#d500f9') orbitCol = color(213, 0, 249, map(orbitAlpha, 0, 255, 0, currentEntityAlpha));
                
                stroke(orbitCol);
                strokeWeight(max(1.5, this.d * 0.10)); noFill();
                let numSegments = 6; let segmentLength = (TWO_PI / numSegments) * 0.45; 
                push(); translate(this.p.x, this.p.y); rotate(orbitAngle * 0.5); 
                for (let i = 0; i < numSegments; i++) {
                    let startAngle = i * (TWO_PI / numSegments);
                    arc(0, 0, this.d * 1.45 * this.spawnScale, this.d * 1.45 * this.spawnScale, startAngle, startAngle + segmentLength);
                }
                pop();
            }

            let chipSkin = (this.color === PLAYER2_COLOR) ? p2ChipSkin : p1ChipSkin;
            
            push();
            translate(this.p.x, this.p.y);
            rotate(this.angle);
            scale(this.spawnScale);
            
            if (chipSkin === 0) {
                // Classic Skin
                stroke(0, currentEntityAlpha);
                strokeWeight(max(2.0, this.d * 0.12));
                fill(this.color);
                ellipse(0, 0, this.d);
                fill(255, currentEntityAlpha);
                noStroke();
                drawStar(0, 0, this.d * 0.15, this.d * 0.32, 5);
            } else if (chipSkin === 1) {
                // Neon Glow Skin
                stroke(this.color);
                strokeWeight(max(3.0, this.d * 0.16));
                fill(0, map(currentEntityAlpha, 0, 255, 0, 180));
                ellipse(0, 0, this.d);
                stroke(255, currentEntityAlpha);
                strokeWeight(max(1.0, this.d * 0.05));
                noFill();
                ellipse(0, 0, this.d * 0.7);
                let pSize = this.d * (0.2 + 0.04 * sin(frameCount * 0.15));
                fill(this.color);
                noStroke();
                ellipse(0, 0, pSize);
            } else {
                // Cyber Tech Skin
                stroke(45, 55, 72, currentEntityAlpha);
                strokeWeight(max(1.5, this.d * 0.08));
                fill('#0f141c');
                ellipse(0, 0, this.d);
                stroke(this.color);
                strokeWeight(max(1.5, this.d * 0.07));
                let numTicks = 8;
                for (let i = 0; i < numTicks; i++) {
                    let a = i * (TWO_PI / numTicks);
                    line(cos(a) * this.d * 0.38, sin(a) * this.d * 0.38, cos(a) * this.d * 0.48, sin(a) * this.d * 0.48);
                }
                fill(this.color);
                noStroke();
                ellipse(0, 0, this.d * 0.4);
                stroke(0, 150);
                strokeWeight(max(1.5, this.d * 0.06));
                noFill();
                ellipse(0, 0, this.d * 0.25);
            }
            pop();
        }
        pop();
    }

    checkGoal() {
        if (!this.isBall || isResettingPositions || isEvacuating || isEditingTactic || matchWinner || isGoalCelebrating || isKickOffActive) return false;

        if (this.p.y < fieldY - 3) { 
            let scoringTeam = PLAYER1_COLOR; let nextTurnTeam = PLAYER2_COLOR; 
            let isAutoGoal = false;
            if (lastTouchColor === PLAYER2_COLOR) { goalOverlayText = 'АВТОГОЛ!'; scoringTeam = PLAYER1_COLOR; nextTurnTeam = PLAYER2_COLOR; p1Goals++; isAutoGoal = true; } 
            else { goalOverlayText = 'ГОЛ!'; p1Goals++; }
            
            triggerVibrate(60); 
            createGoalBurstParticles(this.p.x, fieldY, scoringTeam, true);
            playSound('goal', 0.85); 
            
            postGoalFramesToRecord = 30;
            pendingGoalInfo = { scoringTeam: scoringTeam, nextTurnTeam: nextTurnTeam, isAutoGoal: isAutoGoal };
            
            if (isOnline && socket) {
                socket.emit('goalScored', {
                    room: onlineRoomId,
                    scoringTeam: scoringTeam,
                    nextTurnTeam: nextTurnTeam,
                    isAutoGoal: isAutoGoal,
                    p1Goals: p1Goals,
                    p2Goals: p2Goals
                });
            }

            startGoalCelebrationPhase(scoringTeam, nextTurnTeam, true);
            if (isOnline) {
                if (onlineMyRole === 'PLAYER1' && p1Goals === 0 && p2Goals >= 2) wasLosingTwoNil = true;
                else if (onlineMyRole === 'PLAYER2' && p2Goals === 0 && p1Goals >= 2) wasLosingTwoNil = true;
            } else {
                if (p1Goals === 0 && p2Goals >= 2) wasLosingTwoNil = true;
            }
            return true; 
        } 

        if (this.p.y > fieldY + fieldH + 3) { 
            let scoringTeam = PLAYER2_COLOR; let nextTurnTeam = PLAYER1_COLOR; 
            let isAutoGoal = false;
            if (lastTouchColor === PLAYER1_COLOR) { goalOverlayText = 'АВТОГОЛ!'; scoringTeam = PLAYER2_COLOR; nextTurnTeam = PLAYER1_COLOR; p2Goals++; isAutoGoal = true; } 
            else { goalOverlayText = 'ГОЛ!'; p2Goals++; }
            
            triggerVibrate(60); 
            createGoalBurstParticles(this.p.x, fieldY + fieldH, scoringTeam, false);
            playSound('goal', 0.85); 
            
            postGoalFramesToRecord = 30;
            pendingGoalInfo = { scoringTeam: scoringTeam, nextTurnTeam: nextTurnTeam, isAutoGoal: isAutoGoal };
            
            if (isOnline && socket) {
                socket.emit('goalScored', {
                    room: onlineRoomId,
                    scoringTeam: scoringTeam,
                    nextTurnTeam: nextTurnTeam,
                    isAutoGoal: isAutoGoal,
                    p1Goals: p1Goals,
                    p2Goals: p2Goals
                });
            }

            startGoalCelebrationPhase(scoringTeam, nextTurnTeam, false);
            if (isOnline) {
                if (onlineMyRole === 'PLAYER1' && p1Goals === 0 && p2Goals >= 2) wasLosingTwoNil = true;
                else if (onlineMyRole === 'PLAYER2' && p2Goals === 0 && p1Goals >= 2) wasLosingTwoNil = true;
            } else {
                if (p1Goals === 0 && p2Goals >= 2) wasLosingTwoNil = true;
            }
            return true; 
        } 
        return false;
    }
}

class Particle {
    constructor(x, y, color, speedMult = 1) {
        this.p = createVector(x, y); 
        this.v = p5.Vector.random2D().mult(random(2, 5) * speedMult);
        this.alpha = 255; this.rgb = getFastRgb(color); this.size = random(3, 5);
    }
    update() { this.p.add(this.v); this.v.mult(0.95); this.alpha -= 6; }
    display() {
        push(); noStroke();
        fill(this.rgb.r, this.rgb.g, this.rgb.b, this.alpha);
        ellipse(this.p.x, this.p.y, this.size); pop();
    }
}

class BlackStrokeParticle {
    constructor(parentChip) {
        this.parent = parentChip;
        this.targetX = parentChip.p.x;
        this.targetY = parentChip.p.y;
        let chipScale = (parentChip && parentChip.d) ? (parentChip.d / 35) : 1;
        this.angle = random(TWO_PI);
        this.orbitRadius = random(parentChip.d * 0.4, parentChip.d * 0.65);
        this.angularSpeed = random(0.06, 0.13) * (random() > 0.5 ? 1 : -1);
        this.radialSpeed = random(-0.05, 0.25) * chipScale; // expand slightly outward
        this.length = random(5, 9) * chipScale;
        this.strokeWidth = random(1.2, 2.0) * chipScale;
        this.alpha = 240;
        this.decay = random(4.5, 8.5);
    }
    update() {
        if (this.parent) {
            this.targetX = this.parent.p.x;
            this.targetY = this.parent.p.y;
        }
        this.angle += this.angularSpeed;
        this.orbitRadius += this.radialSpeed;
        this.alpha -= this.decay;
    }
    display() {
        push();
        noFill();
        stroke(15, 15, 15, this.alpha);
        strokeWeight(this.strokeWidth);
        
        // Calculate the starting point of the stroke
        let x1 = this.targetX + cos(this.angle) * this.orbitRadius;
        let y1 = this.targetY + sin(this.angle) * this.orbitRadius;
        
        // Angle of the stroke along the circular tangent
        let tangentAngle = this.angle + HALF_PI;
        let x2 = x1 + cos(tangentAngle) * this.length;
        let y2 = y1 + sin(tangentAngle) * this.length;
        
        line(x1, y1, x2, y2);
        pop();
    }
}

class GoalBurstParticle {
    constructor(x, y, color, isTopGoal) {
        this.p = createVector(x, y);
        let angle = isTopGoal ? random(0.12 * PI, 0.88 * PI) : random(-0.88 * PI, -0.12 * PI);
        this.v = createVector(cos(angle), sin(angle)).mult(random(3.5, 8.5));
        this.alpha = 255;
        this.decay = random(3.2, 5.2);
        this.rgb = getFastRgb(color);
        this.size = random(4.5, 7.5);
    }
    update() { 
        this.p.add(this.v); 
        this.v.mult(0.95); 
        this.alpha -= this.decay; 
    }
    display() {
        if (this.alpha <= 0) return;
        push(); noStroke();
        fill(this.rgb.r, this.rgb.g, this.rgb.b, this.alpha);
        ellipse(this.p.x, this.p.y, this.size); pop();
    }
}

class SparkLine {
    constructor(x, y, color, angle, speed) {
        this.p = createVector(x, y);
        this.v = createVector(cos(angle), sin(angle)).mult(speed);
        this.length = random(10, 22);
        this.alpha = 255;
        this.rgb = getFastRgb(color);
        this.decay = random(6, 11);
    }
    update() {
        this.p.add(this.v);
        this.v.mult(0.94);
        this.alpha -= this.decay;
    }
    display() {
        push();
        strokeWeight(random(1.5, 3));
        stroke(this.rgb.r, this.rgb.g, this.rgb.b, this.alpha);
        let endP = p5.Vector.add(this.p, p5.Vector.mult(this.v, this.length * 0.15));
        line(this.p.x, this.p.y, endP.x, endP.y);
        pop();
    }
}

class GrassParticle {
    constructor(x, y) {
        this.p = createVector(x, y);
        this.v = p5.Vector.random2D().mult(random(1, 3.5));
        this.alpha = 255;
        let greenColors = ['#2e7d32', '#4caf50', '#81c784', '#1b5e20', '#aed581'];
        this.rgb = getFastRgb(random(greenColors));
        this.sizeW = random(2, 4);
        this.sizeH = random(6, 12);
        this.angle = random(TWO_PI);
        this.rotSpeed = random(-0.2, 0.2);
    }
    update() {
        this.p.add(this.v);
        this.v.y += 0.08; 
        this.v.mult(0.96);
        this.angle += this.rotSpeed;
        this.alpha -= 5;
    }
    display() {
        push();
        translate(this.p.x, this.p.y);
        rotate(this.angle);
        noStroke();
        fill(this.rgb.r, this.rgb.g, this.rgb.b, this.alpha);
        rect(-this.sizeW/2, -this.sizeH/2, this.sizeW, this.sizeH, 1);
        pop();
    }
}

class SmokeRing {
    constructor(x, y, maxRadius, color = '#ffffff') {
        this.p = createVector(x, y);
        this.r = 5;
        this.maxRadius = maxRadius;
        this.alpha = 200;
        this.rgb = getFastRgb(color);
        this.growSpeed = random(2.5, 4.5);
    }
    update() {
        this.r += this.growSpeed;
        this.alpha = map(this.r, 5, this.maxRadius, 200, 0);
    }
    display() {
        if (this.alpha <= 0) return;
        push();
        noFill();
        stroke(this.rgb.r, this.rgb.g, this.rgb.b, this.alpha);
        strokeWeight(map(this.r, 5, this.maxRadius, 4, 0.5));
        ellipse(this.p.x, this.p.y, this.r * 2);
        pop();
    }
}

class ConfettiParticle {
    constructor(x, y, color) {
        this.p = createVector(x, y);
        this.v = createVector(random(-2, 2), random(2, 6));
        this.alpha = 255;
        this.rgb = getFastRgb(color);
        this.w = random(6, 12);
        this.h = random(4, 8);
        this.angleX = random(TWO_PI);
        this.angleY = random(TWO_PI);
        this.rotX = random(-0.1, 0.1);
        this.rotY = random(-0.1, 0.1);
        this.swaySpeed = random(0.02, 0.06);
        this.swayOffset = random(100);
    }
    update() {
        this.v.x = sin(frameCount * this.swaySpeed + this.swayOffset) * 1.5;
        this.p.add(this.v);
        this.angleX += this.rotX;
        this.angleY += this.rotY;
        this.alpha -= 2.2;
    }
    display() {
        push();
        translate(this.p.x, this.p.y);
        rotate(this.angleX);
        noStroke();
        fill(this.rgb.r, this.rgb.g, this.rgb.b, this.alpha);
        let displayW = this.w * cos(this.angleY);
        let displayH = this.h * sin(this.angleX);
        rect(-displayW/2, -displayH/2, displayW, displayH);
        pop();
    }
}

class FireworkRocket {
    constructor(startX, startY, targetY, teamColor) {
        this.p = createVector(startX, startY);
        let dx = random(-1.5, 1.5);
        let dy = random(-10, -7);
        this.v = createVector(dx, dy);
        this.targetY = targetY;
        this.teamColor = teamColor;
        this.alpha = 255;
        this.exploded = false;
    }
    update() {
        this.p.add(this.v);
        this.v.y += 0.05; 
        if (random() < 0.4) {
            particles.push(new Particle(this.p.x, this.p.y, '#ffd700', 0.2));
        }
        if (this.v.y >= 0 || this.p.y <= this.targetY) {
            this.explode();
            this.exploded = true;
            this.alpha = 0; 
        }
    }
    explode() {
        playSound('hit', 0.85);
        let numSparks = random(18, 28);
        for (let i = 0; i < numSparks; i++) {
            let angle = (TWO_PI / numSparks) * i + random(-0.1, 0.1);
            let speed = random(2.5, 6.5);
            particles.push(new SparkLine(this.p.x, this.p.y, this.teamColor, angle, speed));
        }
        particles.push(new SmokeRing(this.p.x, this.p.y, 75, this.teamColor));
        for (let i = 0; i < 12; i++) {
            particles.push(new Particle(this.p.x, this.p.y, random(['#ffffff', '#ffd700', this.teamColor]), 1.5));
        }
    }
    display() {
        if (this.exploded) return;
        push();
        noStroke();
        fill('#ffffff');
        ellipse(this.p.x, this.p.y, 6, 6);
        fill(this.teamColor);
        ellipse(this.p.x, this.p.y, 4, 4);
        pop();
    }
}

function createSparks(x, y, color, intensity) {
    if (particles.length > 250 || matchWinner) return; 
    let count = constrain(map(intensity, 0, 10, 2, 7), 2, 10);
    
    for(let i=0; i<count; i++) {
        particles.push(new Particle(x, y, color, map(intensity, 0, 10, 0.7, 1.4)));
    }
    
    let sparkLinesCount = constrain(floor(intensity * 0.8), 1, 6);
    for (let i = 0; i < sparkLinesCount; i++) {
        let angle = random(TWO_PI);
        let speed = random(1, 4.5) * (1 + intensity * 0.1);
        particles.push(new SparkLine(x, y, color, angle, speed));
    }
    
    if (y > fieldY && y < fieldY + fieldH) {
        let grassCount = constrain(floor(intensity * 0.6), 1, 4);
        for (let i = 0; i < grassCount; i++) {
            particles.push(new GrassParticle(x, y));
        }
    }
    
    if (intensity > 4.5) {
        particles.push(new SmokeRing(x, y, map(intensity, 4.5, 15, 30, 80), color));
        shakeAmount = max(shakeAmount, map(intensity, 4.5, 15, 1.5, 7));
    }
}

function createGoalBurstParticles(x, y, teamColor, isTopGoal) {
    let goalLeftX = (fieldX + fieldW / 2) - goalW / 2;
    let goalRightX = (fieldX + fieldW / 2) + goalW / 2;
    let goalY = isTopGoal ? fieldY : (fieldY + fieldH);

    for (let i = 0; i < 40; i++) { 
        let spawnX = random(goalLeftX, goalRightX);
        particles.push(new GoalBurstParticle(spawnX, goalY, teamColor, isTopGoal));
    }
    let centerX = (goalLeftX + goalRightX) / 2;
    particles.push(new SmokeRing(centerX, goalY, 100, teamColor));
    particles.push(new SmokeRing(centerX, goalY, 60, '#ffffff'));
    shakeAmount = 12;
    
    particles.push(new FireworkRocket(width * 0.2, height, height * random(0.25, 0.45), teamColor));
    particles.push(new FireworkRocket(width * 0.5, height, height * random(0.15, 0.35), teamColor));
    particles.push(new FireworkRocket(width * 0.8, height, height * random(0.25, 0.45), teamColor));
}

function createShieldDeactivationSparkles() {
    let topGoalW = goalW;
    let botGoalW = goalW;
    let lvl = isCampaign ? CAMPAIGN_LEVELS[currentLevel] : null;
    if (isCampaign && lvl && lvl.scenario === 'striker') {
        topGoalW = goalW * 0.55;
        botGoalW = goalW * 1.45;
    }
    
    // Top goal sparks
    let startXTop = fieldX + fieldW/2 - topGoalW/2;
    for (let i = 0; i <= 10; i++) {
        let x = startXTop + (topGoalW / 10) * i;
        createSparks(x, fieldY, '#0096ff', 3);
    }
    // Bottom goal sparks
    let startXBot = fieldX + fieldW/2 - botGoalW/2;
    for (let i = 0; i <= 10; i++) {
        let x = startXBot + (botGoalW / 10) * i;
        createSparks(x, fieldY + fieldH, '#0096ff', 3);
    }
    playSound('chip_wall', 0.5);
}

function startGoalCelebrationPhase(scoringTeam, nextTurnTeam, isTopGoal = true) {
    isGoalCelebrating = true;
    goalCelebrationTimer = 180; 
    pendingNextTurnTeam = nextTurnTeam;
    goalScoringTeamColor = scoringTeam;
    goalScoredIsTopGoal = isTopGoal;
    myShotPendingResolve = false;
    
    shakeAmount = 12; 
    goalTextTimer = 180; 
    targetFieldScale = 1.0; 
}

function triggerWin(winnerName) {
    matchWinner = winnerName; 
    shakeAmount = 0; 
    goalTextTimer = 180; 
    targetFieldScale = 1.0; 
    
    let loseColor = (p1Goals > p2Goals) ? PLAYER2_COLOR : PLAYER1_COLOR;
    for (let e of entities) {
        e.v.set(0, 0);
        if (!e.isBall && e.color === loseColor) e.color = '#555555'; 
    }
    playSound('over', 0.85);
    triggerVibrate(80);

    // Achievements check
    if (isCampaign) {
        if (p1Goals > p2Goals) {
            checkAndAwardAchievements('campaign_win');
        }
    } else if (isVsBot && !isCampaign && !isTournament) {
        if (p1Goals > p2Goals) {
            checkAndAwardAchievements('bot_win', { difficulty: botDifficulty, botGoals: p2Goals, myGoals: p1Goals });
        }
    } else if (isOnline) {
        let weWon = false;
        if (onlineMyRole === 'PLAYER1' && p1Goals > p2Goals) weWon = true;
        if (onlineMyRole === 'PLAYER2' && p2Goals > p1Goals) weWon = true;
        
        unlockAchievement("online_first_match");
        if (weWon) {
            checkAndAwardAchievements('online_win');
        }
    }
}

function resetGoalsAndReplays() {
    scoredGoalsList = [];
    frameHistory = [];
    lastShotFrameIndex = 0;
    prevShotFrameIndex = 0;
    wasMovingLastFrame = false;
}

function recordGoalEvent(scoringTeam, isAutoGoal) {
    let goalType = isAutoGoal ? 'АВТОГОЛ!' : 'ГОЛ!';
    let teamName = getMatchTeamNameByColor(scoringTeam);
    
    let sourceFrames = frameHistory.slice(prevShotFrameIndex);
    if (sourceFrames.length === 0) sourceFrames = frameHistory;

    let replayCopy = sourceFrames.map(frame => 
        frame.map(e => ({
            x: e.x,
            y: e.y,
            isBall: e.isBall,
            color: e.color,
            d: e.d,
            angle: e.angle || 0
        }))
    );
    
    let goalInfo = {
        teamColor: scoringTeam,
        teamName: teamName,
        type: goalType,
        scoreAfter: `${p1Goals}:${p2Goals}`,
        replayFrames: replayCopy
    };
    scoredGoalsList.push(goalInfo);
    
    return replayCopy;
}

function startInstantReplay(frames, returnState = null) {
    if (!frames || frames.length === 0) return false;
    isReplaying = true;
    replayFrameIdx = 0;
    replaySubFrameIdx = 0;
    replaySource = frames;
    replayReturnState = returnState;
    replayPrePauseCount = 20; 
    replayLoopCount = 0;
    replayPaused = false;
    isDraggingReplaySlider = false;

    // Trigger VAR goal line check for live during-game replays
    if (returnState === null || returnState === 'GAME' || returnState === 'GAME_WIN') {
        isVARCheckActive = true;
        varCheckTimer = 0;
        playSound('score', 0.9);
        triggerVibrate(40);
    } else {
        isVARCheckActive = false;
    }
    return true;
}

function updateAndDrawReplay() {
    let isLiveInGameReplay = (replayReturnState === null || replayReturnState === 'GAME' || replayReturnState === 'GAME_WIN');

    // Handle VAR Goal-Line Check Phase before live slow-mo replay
    if (isLiveInGameReplay && isVARCheckActive) {
        varCheckTimer++;
        drawVARCheckOverlay();
        if (varCheckTimer >= 80) { // ~1.3 seconds VAR animation
            isVARCheckActive = false;
        }
        return;
    }

    let frame = replaySource[replayFrameIdx];
    if (!frame) {
        stopReplay();
        return;
    }

    background(animatedBgColor || ORIGINAL_BG); 
    drawModernBackground();
    
    push();
    if (replayReturnState === 'MATCH_RESULTS' || replayReturnState === 'TOUR_BRACKET') {
        translate(width / 2, height / 2 - 45); scale(0.82); translate(-width / 2, -height / 2);
    } else {
        translate(width / 2, height / 2); translate(-width / 2, -height / 2);
    }

    drawVisualLayout(); 

    // DRAW TRAJECTORIES (ONLY for live during-game replays, NOT in chronology)
    if (isLiveInGameReplay && replaySource && replaySource.length > 1) {
        drawReplayTrajectories(replayFrameIdx);
    }

    for (let item of frame) {
        push();
        if (item.isBall) {
            // Motion echo ghosting in slow-mo
            if (isLiveInGameReplay && replayFrameIdx > 2) {
                let prevItem = replaySource[max(0, replayFrameIdx - 3)].find(e => e.isBall);
                if (prevItem) {
                    fill(255, 255, 200, 60);
                    noStroke();
                    ellipse(prevItem.x, prevItem.y, item.d * 0.9);
                }
            }

            // Тень мяча
            fill(0, 75); 
            noStroke();
            ellipse(item.x + 3, item.y + 4, item.d); 

            // Сам мяч
            push(); 
            translate(item.x, item.y); 
            rotate(item.angle || 0);
            fill(255); 
            stroke(40); 
            strokeWeight(max(1.5, item.d * 0.16)); 
            ellipse(0, 0, item.d); 
            
            let dotSize = (item.d / 2) * 0.9; 
            let offset = (item.d / 2) - dotSize / 2 - 0.5; 
            fill(40); 
            noStroke(); 
            ellipse(-offset, 0, dotSize); 
            ellipse(offset, 0, dotSize);  
            pop();
        } else {
            // Тень фишки
            fill(0, 80); 
            noStroke();
            ellipse(item.x + 4, item.y + 5, item.d);

            // Сама фишка
            stroke(0); 
            strokeWeight(max(2.0, item.d * 0.12));
            fill(item.color);
            push();
            translate(item.x, item.y);
            rotate(item.angle || 0);
            ellipse(0, 0, item.d);

            // Белая звезда в центре
            fill(255); 
            noStroke();
            drawStar(0, 0, item.d * 0.15, item.d * 0.32, 5);
            pop();
        }
        pop();
    }
    
    pop();

    // Top Header Banner
    push();
    rectMode(CORNER);
    textAlign(LEFT, CENTER);
    textStyle(BOLD);
    
    let pulse = sin(frameCount * 0.15) > 0;
    
    // Neat, subtle replay badge in top-left corner
    fill('rgba(15, 23, 42, 0.75)');
    stroke('rgba(255, 255, 255, 0.2)');
    strokeWeight(1);
    rect(12, 14, 115, 26, 6);

    fill(pulse ? '#ff3838' : '#bb1111');
    noStroke();
    ellipse(24, 27, 8, 8);

    fill('#ffffff');
    textSize(10.5);
    text("ПОВТОР ГОЛА", 36, 27);
    pop();

    let btnSkip = {
        x: width - 110,
        y: 20,
        w: 90,
        h: 30
    };
    let hSkip = (mouseX > btnSkip.x && mouseX < btnSkip.x + btnSkip.w && mouseY > btnSkip.y && mouseY < btnSkip.y + btnSkip.h);
    
    push();
    fill(hSkip ? 'rgba(255, 255, 255, 0.25)' : 'rgba(0, 0, 0, 0.4)');
    stroke('rgba(255, 255, 255, 0.4)');
    strokeWeight(1);
    rect(btnSkip.x, btnSkip.y, btnSkip.w, btnSkip.h, 6);
    
    textAlign(CENTER, CENTER);
    textSize(11);
    textStyle(BOLD);
    fill('#ffffff');
    text("ПРОПУСТИТЬ >>", btnSkip.x + btnSkip.w/2, btnSkip.y + btnSkip.h/2 + 0.5);
    pop();

    if (replayReturnState === 'MATCH_RESULTS') {
        // Transparent backdrop panel for interactive controls
        push();
        fill('rgba(15, 20, 28, 0.85)');
        stroke('rgba(88, 166, 255, 0.2)');
        strokeWeight(1);
        rectMode(CORNER);
        rect(15, height - 125, width - 30, 110, 12);
        pop();

        // 1. Play/Pause Button
        let playBtnX = width / 2;
        let playBtnY = height - 90;
        let playBtnRadius = 20; // 40px diameter
        let isHoverPlay = dist(mouseX, mouseY, playBtnX, playBtnY) < playBtnRadius;

        push();
        if (isHoverPlay) {
            fill('rgba(88, 166, 255, 0.25)');
            stroke('#58a6ff');
            strokeWeight(2);
            ellipse(playBtnX, playBtnY, playBtnRadius * 2 + 6);
        }
        
        fill(isHoverPlay ? 'rgba(88, 166, 255, 0.2)' : 'rgba(22, 27, 34, 0.9)');
        stroke('#30363d');
        strokeWeight(1.5);
        ellipse(playBtnX, playBtnY, playBtnRadius * 2);

        fill('#ffffff');
        noStroke();
        if (replayPaused) {
            push();
            translate(playBtnX, playBtnY);
            triangle(-5, -8, -5, 8, 8, 0);
            pop();
        } else {
            rectMode(CENTER);
            rect(playBtnX - 4, playBtnY, 4, 14, 1);
            rect(playBtnX + 4, playBtnY, 4, 14, 1);
        }
        pop();

        // 2. Seek Slider Bar
        let progressW = width * 0.76;
        let progressX = width/2 - progressW/2;
        let progressY = height - 45;

        push();
        fill('rgba(255, 255, 255, 0.15)');
        noStroke();
        rectMode(CORNER);
        rect(progressX, progressY - 3, progressW, 6, 3);

        let fillW = map(replayFrameIdx, 0, replaySource.length - 1, 0, progressW);
        fill('#58a6ff');
        rect(progressX, progressY - 3, fillW, 6, 3);

        let handleX = progressX + fillW;
        let isHoverHandle = dist(mouseX, mouseY, handleX, progressY) < 12;
        
        if (isHoverHandle || isDraggingReplaySlider) {
            fill('rgba(88, 166, 255, 0.4)');
            ellipse(handleX, progressY, 20);
        }
        fill('#ffffff');
        stroke('#58a6ff');
        strokeWeight(2);
        ellipse(handleX, progressY, 12);
        pop();

        // Time / Frame Label
        push();
        textAlign(CENTER, TOP);
        textSize(10);
        textStyle(BOLD);
        fill('#8b949e');
        let currentTimeSec = (replayFrameIdx / 60).toFixed(1);
        let totalTimeSec = (replaySource.length / 60).toFixed(1);
        text(`${currentTimeSec}s / ${totalTimeSec}s  (КАДР ${replayFrameIdx + 1}/${replaySource.length})`, width / 2, height - 32);
        pop();
    }

    // Handle frame index incrementing
    if (replayPrePauseCount > 0) {
        replayPrePauseCount--;
        push();
        textAlign(CENTER, CENTER);
        textSize(12);
        textStyle(BOLD);
        fill('rgba(255, 255, 255, 0.7)');
        text("ПОДГОТОВКА...", width / 2, height - 145);
        pop();
    } else {
        if (!replayPaused && !isDraggingReplaySlider) {
            if (isLiveInGameReplay) {
                // SLOW MOTION PLAYBACK (~0.45x speed for in-game replays)
                replaySubFrameIdx += 0.45;
                replayFrameIdx = floor(replaySubFrameIdx);
            } else {
                // Normal speed for chronology replays
                replayFrameIdx++;
            }

            if (replayFrameIdx >= replaySource.length) {
                if (replayReturnState === 'MATCH_RESULTS' && replayLoopCount < 1) {
                    replayLoopCount++;
                    replayFrameIdx = 0;
                    replaySubFrameIdx = 0;
                    replayPrePauseCount = 30; 
                } else {
                    stopReplay();
                }
            }
        }
    }
}

// Draw Trajectories for Live In-Game Slow-Mo Replays
function drawReplayTrajectories(curFrameIdx) {
    if (!replaySource || replaySource.length === 0) return;

    let historyPoints = [];
    let ballD = 20;

    for (let i = 0; i <= curFrameIdx; i++) {
        let f = replaySource[i];
        if (!f) continue;
        let b = f.find(item => item.isBall);
        if (b) {
            historyPoints.push({ x: b.x, y: b.y });
            ballD = b.d;
        }
    }

    if (historyPoints.length < 2) return;

    push();
    // 1. Draw glowing trajectory tail path
    noFill();
    for (let i = 1; i < historyPoints.length; i++) {
        let p1 = historyPoints[i - 1];
        let p2 = historyPoints[i];
        let progress = i / historyPoints.length;
        
        stroke(color(0, 229, 255, map(progress, 0, 1, 30, 220)));
        strokeWeight(map(progress, 0, 1, 2, 5));
        line(p1.x, p1.y, p2.x, p2.y);
    }

    // 2. Draw trajectory keyframes / dots
    for (let i = 0; i < historyPoints.length; i += 6) {
        let pt = historyPoints[i];
        let alpha = map(i, 0, historyPoints.length, 40, 200);
        fill(0, 229, 255, alpha);
        noStroke();
        ellipse(pt.x, pt.y, 6);
    }

    // 3. Vector Direction Arrow on ball
    let lastPt = historyPoints[historyPoints.length - 1];
    let prevPt = historyPoints[max(0, historyPoints.length - 5)];
    let dir = createVector(lastPt.x - prevPt.x, lastPt.y - prevPt.y);
    if (dir.mag() > 0.5) {
        dir.normalize().mult(32);
        stroke('#ffd700');
        strokeWeight(2.5);
        line(lastPt.x, lastPt.y, lastPt.x + dir.x, lastPt.y + dir.y);
        
        push();
        translate(lastPt.x + dir.x, lastPt.y + dir.y);
        rotate(dir.heading());
        fill('#ffd700');
        noStroke();
        triangle(0, 0, -8, -4, -8, 4);
        pop();
    }

    // 4. Projected Future Trajectory Dots into Goal
    let futureCount = min(18, replaySource.length - curFrameIdx);
    for (let i = 1; i < futureCount; i++) {
        let futFrame = replaySource[curFrameIdx + i];
        if (!futFrame) continue;
        let bFut = futFrame.find(item => item.isBall);
        if (bFut) {
            fill(255, 215, 0, map(i, 1, futureCount, 180, 20));
            noStroke();
            ellipse(bFut.x, bFut.y, 4.5);
        }
    }
    pop();
}

function stopReplay() {
    isReplaying = false;
    if (replayReturnState === 'GAME_WIN') {
        replayReturnState = null;
        let winTeam = pendingWinTeamName || getMatchTeamNameByPlayer(1);
        pendingWinTeamName = null;
        triggerWin(winTeam);
    } else if (replayReturnState === 'MATCH_RESULTS') {
        gameState = 'MATCH_RESULTS';
        replayReturnState = null;
    } else {
        if (gameState === 'GAME') {
            goalCelebrationTimer = 0;
            goalTextTimer = 0;
        }
    }
}

function drawBallTrail() {
    if (matchWinner || isEditingTactic) return; 
    push();

    for (let i = 0; i < ballTrail.length; i++) {
        let pt = ballTrail[i];
        let size = map(i, 0, ballTrail.length - 1, 4, 14);
        let alpha = map(i, 0, ballTrail.length - 1, 10, pt.alpha);
        
        if (trailSkin === 0) {
            // Classic Trail
            noStroke(); 
            fill(255, alpha * 0.45); 
            ellipse(pt.x, pt.y, size);
            pt.alpha -= 1.8;
        } else if (trailSkin === 1) {
            // Star Dust Trail
            push();
            translate(pt.x + sin(frameCount * 0.1 + i) * 1.5, pt.y);
            noStroke();
            fill(255, 215, 0, alpha * 0.7);
            drawStar(0, 0, size * 0.3, size * 0.7, 4);
            pop();
            pt.alpha -= 2.2;
        } else {
            // Ghost Echo Trail
            if (i % 3 === 0 || i === ballTrail.length - 1) {
                push();
                translate(pt.x, pt.y);
                noFill();
                stroke(0, 229, 255, alpha * 0.3);
                strokeWeight(2);
                ellipse(0, 0, size * 1.1);
                
                fill(255, alpha * 0.15);
                noStroke();
                ellipse(0, 0, size * 0.7);
                pop();
            }
            pt.alpha -= 2.0;
        }
    }
    for (let i = ballTrail.length - 1; i >= 0; i--) { if (ballTrail[i].alpha <= 0) ballTrail.splice(i, 1); }
    pop();
}

    createCanvas(windowWidth, windowHeight);
    ellipseMode(CENTER); rectMode(CORNER);

    calculateFieldMetrics();

function calculateFieldMetrics() {
    let oldW = fieldW, oldH = fieldH, oldX = fieldX, oldY = fieldY;

    fieldH = height * 0.82; fieldW = fieldH * 0.61; 
    if (fieldW > width * 0.92) { fieldW = width * 0.92; fieldH = fieldW * (1/0.61); }
    fieldX = (width - fieldW) / 2; fieldY = (height - fieldH) / 2 + 10;
    
    goalW = fieldW * 0.36;
    defaultGoalW = goalW; 
    goalH = fieldH * 0.075;

    if (oldW && oldH && (oldW !== fieldW || oldH !== fieldH)) {
        if (entities && entities.length > 0) {
            for (let e of entities) {
                let relX = (e.p.x - oldX) / oldW;
                let relY = (e.p.y - oldY) / oldH;
                e.p.x = fieldX + relX * fieldW;
                e.p.y = fieldY + relY * fieldH;
                
                if (e.isBall) {
                    e.d = fieldW * 0.0545;
                } else {
                    let lvl = isCampaign ? CAMPAIGN_LEVELS[currentLevel] : null;
                    if (isCampaign && lvl && lvl.scenario === 'titans' && e.color === PLAYER2_COLOR) {
                        e.d = fieldW * 0.145;
                    } else {
                        e.d = fieldW * 0.096;
                    }
                }
            }
        }
    } 

    let bw = 240, bh = 34;
    let btnGap = bh + 8;

function draw() {
    push();
    if (shakeAmount > 0.1 && !matchWinner) { translate(random(-shakeAmount, shakeAmount), random(-shakeAmount, shakeAmount)); shakeAmount *= 0.88; }
    
    if (!animatedBgColor) {
        animatedBgColor = color(ORIGINAL_BG);
    }
    if (gameState !== 'GAME') {
        animatedBgColor = lerpColor(animatedBgColor, color(ORIGINAL_BG), 0.10);
        background(animatedBgColor);
    }
    
    if (isReplaying) {
        updateAndDrawReplay();
        if (screenFadeAlpha > 0) {
            push(); noStroke(); fill(10, 10, 15, screenFadeAlpha); rect(0, 0, width, height); pop();
        }
        pop();
        return;
    }
    
    if (gameState === 'MENU') drawMainMenu();
    else if (gameState === 'MODE_SELECT') drawModeSelect();
    else if (gameState === 'QUICK_MATCH_SETTINGS') drawQuickMatchSettingsPanel();
    else if (gameState === 'DIFFICULTY_SELECT') drawDifficultySelect();
    else if (gameState === 'SETTINGS_PANEL') drawSettingsPanel();
    else if (gameState === 'COSMETICS') drawCosmeticsPanel();
    else if (gameState === 'TOUR_CREATE') drawTournamentTeamSelect();
    else if (gameState === 'TOUR_BRACKET') drawTournamentBracket();
    else if (gameState === 'TOUR_VICTORY_CEREMONY') drawTournamentVictoryCeremony();
    else if (gameState === 'GAME') handleGameLogic();
    else if (gameState === 'TOUR_PODIUM') drawTournamentPodium();
    else if (gameState === 'CAMPAIGN_SELECT') drawCampaignSelect();
    else if (gameState === 'ONLINE_MENU') drawOnlineMenu();
    else if (gameState === 'ONLINE_LOBBY') drawOnlineLobby();
    else if (gameState === 'ONLINE_SETTINGS') drawOnlineSettings();
    else if (gameState === 'MATCH_RESULTS') drawMatchResults();
    
    if (gameState === 'TOUR_PODIUM') {
        if (random() < 0.15) {
            createCelebrationConfetti();
        }
    }

    if (gameState !== 'GAME') {
        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(); if (particles[i].alpha <= 0) particles.splice(i, 1); else particles[i].display();
        }
    }

    if (showTutorialOverlay) drawTutorialModal();
    if (showAchievementsOverlay) drawAchievementsModal();
    if (activeAchievementNotification) drawAchievementNotificationToast();
    if (showScoreEntryModal) drawScoreEntryModal();
    if (showTourSettingsModal) drawTourSettingsModal();
    if (showTourMatchDetailsModal) drawTourMatchDetailsModal();

    // --- SCREEN TRANSITION FADE EFFECT ---
    if (targetScreenFadeAlpha === 255) {
        screenFadeAlpha += 22; 
        if (screenFadeAlpha >= 255) {
            screenFadeAlpha = 255;
            if (pendingGameState) {
                gameState = pendingGameState;
                pendingGameState = null;
            }
            if (transitionCallback) {
                transitionCallback();
                transitionCallback = null;
            }
            targetScreenFadeAlpha = 0; 
        }
    } else if (targetScreenFadeAlpha === 0 && screenFadeAlpha > 0) {
        screenFadeAlpha -= 18; 
        if (screenFadeAlpha < 0) screenFadeAlpha = 0;
    }

    if (screenFadeAlpha > 0) {
        push();
        noStroke();
        fill(10, 10, 15, screenFadeAlpha); 
        rect(0, 0, width, height);
        pop();
    }

    pop();
}

function drawModernBackground() {
    // 1. Sleek dark ambient gradient
    push();
    noFill();
    for (let y = 0; y < height; y += 12) {
        let inter = map(y, 0, height, 0, 1);
        let c = lerpColor(color(11, 13, 17), color(22, 26, 35), inter);
        stroke(c);
        strokeWeight(12);
        line(0, y + 6, width, y + 6);
    }
    pop();
    
    // 2. Subtle modern high-tech geometric lines
    push();
    stroke(88, 166, 255, 8); // extremely subtle neon blue grid
    strokeWeight(1);
    for (let x = 0; x < width; x += 50) {
        line(x, 0, x, height);
    }
    for (let y = 0; y < height; y += 50) {
        line(0, y, width, y);
    }
    
    // Glowing stadium arc outlines
    noFill();
    stroke(88, 166, 255, 12);
    strokeWeight(1.5);
    ellipse(width/2, height/2, min(width, height) * 0.7);
    ellipse(width/2, height/2, min(width, height) * 0.7 + 25);
    
    // Aesthetic accent diagonal stripes in corners
    stroke(255, 255, 255, 4);
    strokeWeight(4);
    for (let i = 0; i < 5; i++) {
        let offset = i * 20;
        line(offset, 0, 0, offset);
        line(width - offset, 0, width, offset);
        line(0, height - offset, offset, height);
        line(width - offset, height, width, height - offset);
    }
    pop();
    
    // 3. Update & Draw drifting, interactive chips
    updateAndDrawMenuChips();
}

function updateAndDrawMenuChips() {
    if (menuChips.length === 0) {
        let colors = ['#f85149', '#58a6ff', '#2ea043', '#d29922', '#bc8cff', '#ff7b72', '#ff79c6', '#f0f6fc'];
        for (let i = 0; i < 9; i++) {
            menuChips.push({
                p: createVector(random(50, width - 50), random(50, height - 50)),
                v: p5.Vector.random2D().mult(random(0.4, 1.2)),
                d: random(28, 42),
                color: colors[i % colors.length],
                rot: random(TWO_PI),
                rotV: random(-0.015, 0.015),
                vibPhase: random(1000), // Unique phase offset for micro-vibrations
                isHovered: false
            });
        }
    }
    
    push();
    for (let chip of menuChips) {
        // Initialize vibPhase if missing
        if (chip.vibPhase === undefined) {
            chip.vibPhase = random(1000);
        }

        // Update physics
        chip.p.add(chip.v);
        chip.rot += chip.rotV;
        
        let r = chip.d / 2;
        // Perfect screen edge bouncing with subtle haptic tap
        if (chip.p.x < r) { 
            chip.p.x = r; 
            chip.v.x *= -1; 
            triggerVibrate(6); 
        }
        if (chip.p.x > width - r) { 
            chip.p.x = width - r; 
            chip.v.x *= -1; 
            triggerVibrate(6); 
        }
        if (chip.p.y < r) { 
            chip.p.y = r; 
            chip.v.y *= -1; 
            triggerVibrate(6); 
        }
        if (chip.p.y > height - r) { 
            chip.p.y = height - r; 
            chip.v.y *= -1; 
            triggerVibrate(6); 
        }
        
        // Dynamic mouse interaction (magnetic repel field)
        let dMouse = dist(mouseX, mouseY, chip.p.x, chip.p.y);
        if (dMouse < 180) {
            let pushForce = map(dMouse, 0, 180, 0.28, 0);
            let dir = createVector(chip.p.x - mouseX, chip.p.y - mouseY).normalize();
            chip.v.add(dir.mult(pushForce));
            chip.v.limit(3.2); // Cap velocity for smooth motion
        }
        
        // Handle hovering and haptics
        let mouseOverChip = dMouse < (chip.d / 2 + 12);
        if (mouseOverChip) {
            if (!chip.isHovered) {
                chip.isHovered = true;
                triggerVibrate(15); // pleasant haptic pulse on hover entry
            }
            if (frameCount % 6 === 0) {
                triggerVibrate(4); // micro haptic tickle during hover
            }
        } else {
            chip.isHovered = false;
        }
        
        // Gentle drift friction to keep them peaceful
        chip.v.mult(0.98);
        if (chip.v.mag() < 0.2) {
            chip.v.add(p5.Vector.random2D().mult(0.08)); // Small random kick
        }
        
        // Chip-to-chip collisions
        for (let other of menuChips) {
            if (chip !== other) {
                let dChips = dist(chip.p.x, chip.p.y, other.p.x, other.p.y);
                let minDist = (chip.d + other.d) / 2;
                if (dChips < minDist) {
                    let overlap = minDist - dChips;
                    let norm = createVector(chip.p.x - other.p.x, chip.p.y - other.p.y).normalize();
                    chip.p.add(p5.Vector.mult(norm, overlap * 0.5));
                    other.p.sub(p5.Vector.mult(norm, overlap * 0.5));
                    
                    let k = p5.Vector.sub(chip.v, other.v).dot(norm);
                    if (k < 0) {
                        let impulse = norm.mult(k);
                        chip.v.sub(impulse);
                        other.v.add(impulse);
                        triggerVibrate(8); // micro haptic bounce on chip-to-chip bounce
                    }
                }
            }
        }
        
        // --- PLEASANT DYNAMIC VISUAL VIBRATION (ТРЕМОР И БИЕНИЕ) ---
        // Basic parameters for idle vs hover state
        let vibAmplitude = chip.isHovered ? 2.2 : 0.45;
        let scalePulse = chip.isHovered ? 1.10 + sin(frameCount * 0.25 + chip.vibPhase) * 0.045 : 1.0 + sin(frameCount * 0.05 + chip.vibPhase) * 0.025;
        
        // Tremor high-frequency jitter (vibration)
        let jitterX = sin(frameCount * 0.45 + chip.vibPhase) * vibAmplitude;
        let jitterY = cos(frameCount * 0.45 + chip.vibPhase) * vibAmplitude;
        
        let renderX = chip.p.x + jitterX;
        let renderY = chip.p.y + jitterY;
        let renderD = chip.d * scalePulse;
        
        // Rendering chip visuals with glowing shadow
        noStroke();
        let glowCol = color(chip.color);
        glowCol.setAlpha(22);
        fill(glowCol);
        ellipse(renderX, renderY, renderD * 1.6); // outer glow aura
        
        glowCol.setAlpha(50);
        fill(glowCol);
        ellipse(renderX, renderY, renderD * 1.25); // inner glow aura
        
        fill(0, 45);
        ellipse(renderX + 3, renderY + 4, renderD); // subtle soft shadow
        
        stroke(255, 140);
        strokeWeight(1.8);
        fill(chip.color);
        ellipse(renderX, renderY, renderD); // primary body
        
        // Inner detail (Rotating Star Symbol)
        push();
        translate(renderX, renderY);
        rotate(chip.rot);
        fill(255, 200);
        noStroke();
        drawStar(0, 0, renderD * 0.14, renderD * 0.30, 5);
        pop();
    }
    pop();
}

function drawGlassCard(cx, cy, cw, ch, headerText = null, subHeaderText = null) {
    push();
    textFont('system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif');
    // Drop shadow
    noStroke();
    fill(0, 110);
    rect(cx + 4, cy + 6, cw, ch, 16);
    
    // Glass background
    fill('rgba(22, 27, 34, 0.88)');
    stroke('rgba(88, 166, 255, 0.20)');
    strokeWeight(1.5);
    rect(cx, cy, cw, ch, 16);
    
    // Glowing accent at the top of the card
    stroke('rgba(255, 255, 255, 0.1)');
    strokeWeight(1);
    line(cx + 10, cy, cx + cw - 10, cy);
    
    if (headerText) {
        textAlign(CENTER, TOP);
        noStroke();
        if (subHeaderText) {
            fill('#8b949e');
            textSize(10);
            textStyle(BOLD);
            text(subHeaderText.toUpperCase(), cx + cw/2, cy + 18);
            
            fill('#f0f6fc');
            textSize(20);
            textStyle(BOLD);
            text(headerText.toUpperCase(), cx + cw/2, cy + 34);
        } else {
            fill('#f0f6fc');
            textSize(20);
            textStyle(BOLD);
            text(headerText.toUpperCase(), cx + cw/2, cy + 24);
        }
    }
    pop();
}

function drawCampaignSelect() {
    drawModernBackground();

    let cardW = min(width * 0.95, 340);
    let cardH = height * 0.95;
    let cx = width/2 - cardW/2;
    let cy = height * 0.025;

    drawGlassCard(cx, cy, cardW, cardH, "КАМПАНИЯ", "РЕЖИМЫ");

    // Total stars display in header
    let totalStars = getCampaignTotalStars();
    push();
    textAlign(RIGHT, CENTER);
    textSize(11);
    textStyle(BOLD);
    fill('#ffd700');
    text("★ " + totalStars + " / 30", cx + cardW - 20, cy + 34);
    pop();

    // Draw level buttons
    let startY = cy + 65;
    let rowH = (cardH - 195) / 10; // height for each level item
    let hoveredLvlIdx = -1;
    
    for (let i = 0; i < CAMPAIGN_LEVELS.length; i++) {
        let lvl = CAMPAIGN_LEVELS[i];
        let ly = startY + i * rowH;
        let lw = cardW - 30;
        let lx = cx + 15;
        
        let isUnlocked = (i === 0 || i <= campaignHighestUnlocked);
        let isOver = (mouseX > lx && mouseX < lx + lw && mouseY > ly && mouseY < ly + rowH - 4);
        
        if (isOver) {
            hoveredLvlIdx = i;
        }
        
        push();
        if (isUnlocked) {
            if (isOver) {
                fill('#1f242c');
                stroke('#58a6ff');
                strokeWeight(1.5);
            } else {
                fill('#161b22');
                stroke('#30363d');
                strokeWeight(1);
            }
        } else {
            // Locked style
            fill('#0d1117');
            stroke('#21262d');
            strokeWeight(1);
        }
        rect(lx, ly, lw, rowH - 4, 8);
        
        // Draw index number badge
        push();
        if (isUnlocked) {
            fill('#21262d');
            stroke('#30363d');
        } else {
            fill('#161b22');
            stroke('#21262d');
        }
        strokeWeight(1);
        rect(lx + 8, ly + (rowH - 4)/2 - 10, 20, 20, 4);
        pop();
        
        noStroke();
        if (isUnlocked) {
            fill('#58a6ff');
        } else {
            fill('#484f58');
        }
        textAlign(CENTER, CENTER);
        textStyle(BOLD);
        textSize(10);
        text(i + 1, lx + 18, ly + (rowH - 4)/2);
        
        // Level name
        textAlign(LEFT, CENTER);
        textStyle(BOLD);
        textSize(11);
        if (isUnlocked) {
            fill(isOver ? '#ffffff' : '#c9d1d9');
        } else {
            fill('#484f58');
        }
        let shortName = lvl.name.replace(/^\d+\.\s*/, ''); // strip "1. " prefix
        
        // If unlocked, draw name slightly shifted up to fit stars below it
        if (isUnlocked) {
            text(shortName, lx + 36, ly + (rowH - 4)/2 - 5);
            
            // Draw 3 small stars under the level name
            let stars = getCampaignLevelStars(i);
            push();
            textSize(9);
            for (let s = 0; s < 3; s++) {
                if (s < stars) {
                    fill('#ffd700'); // glowing gold star
                    text("★", lx + 36 + s * 11, ly + (rowH - 4)/2 + 7);
                } else {
                    fill('#30363d'); // empty outline star
                    text("☆", lx + 36 + s * 11, ly + (rowH - 4)/2 + 7);
                }
            }
            pop();
        } else {
            // Locked: draw centered name and no stars

        // Difficulty badge or Lock symbol on the right

        else fill('#58a6ff');
    } else {
        fill('#30363d');

    let briefLvl = (hoveredLvlIdx !== -1) ? CAMPAIGN_LEVELS[hoveredLvlIdx] : null;

            fill('#c9d1d9');

        textStyle(BOLD);

        text("★ НАГРАДЫ ЗА ЗВЕЗДЫ", bpX + 15, bpY + 8);
        
        textSize(9.5);
        textStyle(BOLD);

        fill(rew1Unlocked ? '#00ffcc' : '#484f58');
        text((rew1Unlocked ? "[V]" : "[X]") + " 10★: Нефрит", bpX + 15, bpY + 25);
        
        // Reward 2: 20 stars
        let rew2Unlocked = (totalStars >= 20);
        fill(rew2Unlocked ? '#ffd700' : '#484f58');
        text((rew2Unlocked ? "[V]" : "[X]") + " 20★: Кристалл", bpX + 105, bpY + 25);
        
        // Reward 3: 25 stars
        let rew3Unlocked = (totalStars >= 25);
        fill(rew3Unlocked ? '#bc8cff' : '#484f58');
        text((rew3Unlocked ? "[V]" : "[X]") + " 25★: Материя", bpX + 195, bpY + 25);
        
        textSize(8.5);
        textStyle(NORMAL);
        fill('#8b949e');
        text("Уникальные цвета фишек с эффектами для быстрых матчей!", bpX + 15, bpY + 41);
    }
    pop();
    
    // Back button
    let bBtn = { x: width/2 - 70, y: cy + cardH - 42, w: 140, h: 32 };
    let hB = (mouseX > bBtn.x && mouseX < bBtn.x + bBtn.w && mouseY > bBtn.y && mouseY < bBtn.y + bBtn.h);
    drawStyledButton(bBtn, "НАЗАД", hB, '#8b949e');
    
    // Save backBtn coordinates for touch detection
    backBtn.x = bBtn.x;
    backBtn.y = bBtn.y;
    backBtn.w = bBtn.w;
