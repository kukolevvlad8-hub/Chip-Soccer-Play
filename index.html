function drawStyledButton(btn, label, isHover, accentColor = null) {
    push();
    let yOff = isHover ? -3 : 0;
    let shadowAlpha = isHover ? 35 : 12;
    
    // Elevating drop shadow
    noStroke();
    fill(0, shadowAlpha);
    rect(btn.x + 2, btn.y + (isHover ? 6 : 3), btn.w, btn.h, 10);
    
    // Background colors (smooth glassmorphism feel)
    let baseColor = isHover ? color('#21262d') : color('#161b22');
    if (accentColor) {
        let acc = color(accentColor);
        if (isHover) {
            baseColor = lerpColor(baseColor, acc, 0.22);
        }
    }
    fill(baseColor);
    
    // Modern sleek border
    let strokeCol = '#30363d';
    if (isHover) {
        strokeCol = accentColor ? accentColor : '#58a6ff';
    } else if (accentColor) {
        let acc = color(accentColor);
        acc.setAlpha(120);
        strokeCol = acc;
    }
    stroke(strokeCol);
    strokeWeight(isHover ? 1.8 : 1.2);
    
    rect(btn.x, btn.y + yOff, btn.w, btn.h, 10);
    
    // Label
    noStroke();
    fill(isHover ? '#ffffff' : '#c9d1d9');
    textAlign(CENTER, CENTER);
    textStyle(BOLD);
    textSize(13);
    
    let displayLabel = label;
    text(displayLabel, btn.x + btn.w/2, btn.y + yOff + btn.h/2);
    pop();
}

function loadAchievements() {
    try {
        let stored = localStorage.getItem('unlockedAchievements');
        if (stored) {
            unlockedAchievements = JSON.parse(stored);
        } else {
            unlockedAchievements = [];
        }
        onlineWinsCount = parseInt(localStorage.getItem('onlineWinsCount') || '0', 10);
    } catch(e) {
        console.error("Error loading achievements", e);
        unlockedAchievements = [];
        onlineWinsCount = 0;
    }
}

function saveAchievements() {
    try {
        localStorage.setItem('unlockedAchievements', JSON.stringify(unlockedAchievements));
        localStorage.setItem('onlineWinsCount', onlineWinsCount);
    } catch(e) {
        console.error("Error saving achievements", e);
    }
}

function unlockAchievement(id) {
    if (unlockedAchievements.includes(id)) return;
    unlockedAchievements.push(id);
    saveAchievements();
    achievementNotificationQueue.push(id);
    if (!activeAchievementNotification) {
        triggerNextAchievementNotification();
    }
}

function triggerNextAchievementNotification() {
    if (achievementNotificationQueue.length === 0) {
        activeAchievementNotification = null;
        return;
    }
    let achId = achievementNotificationQueue.shift();
    let ach = ACHIEVEMENTS_DATA.find(a => a.id === achId);
    if (ach) {
        activeAchievementNotification = ach;
        achievementNotificationTimer = 180;
        playSound('goal_cheer', 0.85);
    }
}

function checkAndAwardAchievements(type, context) {
    if (type === 'campaign_win') {
        unlockAchievement("first_campaign_win");
        
        let totalStars = campaignStars.reduce((a, b) => a + (b || 0), 0);
        if (totalStars >= 15) {
            unlockAchievement("campaign_15_stars");
        }
        
        let completedLevelsCount = campaignStars.filter(stars => (stars || 0) > 0).length;
        if (completedLevelsCount === CAMPAIGN_LEVELS.length) {
            unlockAchievement("campaign_complete");
        }
    } else if (type === 'bot_win' && context) {
        let diff = context.difficulty;
        let botG = context.botGoals;
        let myG = context.myGoals;
        
        if ((diff === 'СЛОЖНО' || diff === 'ЭКСТРЕМАЛЬНО') && botG === 0) {
            unlockAchievement("bot_clean_sheet");
        }
        if (diff === 'ЭКСТРЕМАЛЬНО') {
            unlockAchievement("bot_extreme_win");
        }
        if (wasLosingTwoNil) {
            unlockAchievement("bot_comeback");
        }
    } else if (type === 'online_win') {
        onlineWinsCount++;
        saveAchievements();
        if (onlineWinsCount >= 3) {
            unlockAchievement("online_3_wins");
        }
    }
}

function formatTime(sec) {
    if (sec <= 0) return "0:00";
    if (sec < 10) {
        return sec.toFixed(1);
    }
    let m = floor(sec / 60);
    let s = floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function drawTimerPill(cx, cy, remainingTime, playerColor, isActive) {
    push();
    rectMode(CENTER);
    textAlign(CENTER, CENTER);
    textFont('monospace, system-ui');
    
    let w = 54;
    let h = 20;
    
    if (isActive) {
        let pulse = 100 + 55 * sin(frameCount * 0.15);
        fill('#161b22');
        let col = color(playerColor);
        stroke(red(col), green(col), blue(col), pulse);
        strokeWeight(1.8);
    } else {
        fill('#0d1117');
        stroke('#30363d');
        strokeWeight(1);
    }
    
    rect(cx, cy, w, h, 6);
    
    noStroke();
    if (isActive) {
        fill('#ffffff');
        textStyle(BOLD);
    } else {
        fill('#8b949e');
        textStyle(NORMAL);
    }
    textSize(10.5);
    
    if (remainingTime < 10) {
        let pulseRed = sin(frameCount * 0.3) > 0;
        if (pulseRed) {
            fill('#ff7b72');
            textStyle(BOLD);
        }
    }
    
    text(formatTime(remainingTime), cx, cy - 0.5);
    pop();
}

function completeMatchWithScore(s1, s2) {
    let currentRound = tourRounds[currentRoundIdx];
    let match = currentRound[currentMatchIdx];
    match.played = true;
    match.score1 = s1;
    match.score2 = s2;

    // Generate dummy goals for simulated/fast-completed matches with realistic order
    let goals = [];
    let t1Goals = 0;
    let t2Goals = 0;
    let seq = [];
    
    if (s1 > s2) {
        // Team 1 won, so their last goal must be at the very end.
        // Shuffle the preceding goals: s1-1 for Team 1, s2 for Team 2
        for (let i = 0; i < s1 - 1; i++) seq.push(1);
        for (let i = 0; i < s2; i++) seq.push(2);
        seq = shuffle(seq);
        seq.push(1); // Final goal by the winner
    } else if (s2 > s1) {
        // Team 2 won, so their last goal must be at the very end.
        // Shuffle the preceding goals: s1 for Team 1, s2-1 for Team 2
        for (let i = 0; i < s1; i++) seq.push(1);
        for (let i = 0; i < s2 - 1; i++) seq.push(2);
        seq = shuffle(seq);
        seq.push(2); // Final goal by the winner
    } else {
        // Draw (if possible in this mode), order doesn't matter
        for (let i = 0; i < s1; i++) seq.push(1);
        for (let i = 0; i < s2; i++) seq.push(2);
        seq = shuffle(seq);
    }

    for (let scorer of seq) {
        if (scorer === 1) t1Goals++;
        else t2Goals++;
        goals.push({
            teamColor: scorer === 1 ? match.t1.color : match.t2.color,
            teamName: scorer === 1 ? match.t1.name : match.t2.name,
            type: 'ГОЛ!',
            scoreAfter: `${t1Goals}:${t2Goals}`,
            replayFrames: [] // empty list indicates no recorded video replay
        });
    }
    match.goals = goals;

    currentMatchIdx++;
    if (currentMatchIdx >= currentRound.length) {
        let isEndOfTournament = false;
        let finalMatch = currentRound.find(m => m.isFinal);
        
        if (finalMatch || currentRound.length === 1) {
            isEndOfTournament = true;
        }

        if (isEndOfTournament) {
            let actualFinal = finalMatch || currentRound[0];
            let firstPlaceTeam = (actualFinal.score1 > actualFinal.score2) ? actualFinal.t1 : actualFinal.t2;
            let secondPlaceTeam = (actualFinal.score1 > actualFinal.score2) ? actualFinal.t2 : actualFinal.t1;
            
            let thirdPlaceTeam = null;
            let thirdMatch = currentRound.find(m => m.isThirdPlace);
            if (thirdMatch) {
                thirdPlaceTeam = (thirdMatch.score1 > thirdMatch.score2) ? thirdMatch.t1 : thirdMatch.t2;
            }
            
            tourPodiumResults = {
                first: firstPlaceTeam,
                second: secondPlaceTeam,
                third: thirdPlaceTeam
            };
            
            gameState = 'TOUR_PODIUM';
            for (let i = 0; i < 80; i++) {
                createCelebrationConfetti();
            }
            entities = [];
        } else if (currentRound.length === 2) {
            let l1 = (currentRound[0].score1 > currentRound[0].score2) ? currentRound[0].t2 : currentRound[0].t1;
            let l2 = (currentRound[1].score1 > currentRound[1].score2) ? currentRound[1].t2 : currentRound[1].t1;
            let w1 = (currentRound[0].score1 > currentRound[0].score2) ? currentRound[0].t1 : currentRound[0].t2;
            let w2 = (currentRound[1].score1 > currentRound[1].score2) ? currentRound[1].t1 : currentRound[1].t2;
            
            let nextRoundMatches = [];
            nextRoundMatches.push({ t1: l1, t2: l2, score1: 0, score2: 0, played: false, isThirdPlace: true });
            nextRoundMatches.push({ t1: w1, t2: w2, score1: 0, score2: 0, played: false, isFinal: true });
            
            tourRounds.push(nextRoundMatches);
            currentRoundIdx++;
            currentMatchIdx = 0;
            viewRoundIdx = currentRoundIdx;
            gameState = 'TOUR_BRACKET';
        } else {
            let nextRoundMatches = [];
            for (let i = 0; i < currentRound.length; i += 2) {
                let w1 = (currentRound[i].score1 > currentRound[i].score2) ? currentRound[i].t1 : currentRound[i].t2;
                let w2 = (currentRound[i+1].score1 > currentRound[i+1].score2) ? currentRound[i+1].t1 : currentRound[i+1].t2;
                nextRoundMatches.push({ t1: w1, t2: w2, score1: 0, score2: 0, played: false });
            }
            tourRounds.push(nextRoundMatches);
            currentRoundIdx++;
            currentMatchIdx = 0;
            viewRoundIdx = currentRoundIdx;
            gameState = 'TOUR_BRACKET';
        }
    } else {
        gameState = 'TOUR_BRACKET';
    }
}

function getRoundName(round) {
    if (round.some(m => m.isFinal || m.isThirdPlace)) return "ФИНАЛЬНЫЕ МАТЧИ";
    let len = round.length;
    if (len === 16) return "1/16 ФИНАЛА";
    if (len === 8) return "1/8 ФИНАЛА";
    if (len === 4) return "1/4 ФИНАЛА";
    if (len === 2) return "ПОЛУФИНАЛ";
    if (len === 1) return "ФИНАЛ";
    return "РАУНД";
}

function initDynamicTournament(teamCount) {
    isTournament = true;
    isCampaign = false;
    maxGoalsToWin = tourGoalsLimit;
    currentRoundIdx = 0;
    currentMatchIdx = 0;
    viewRoundIdx = 0;
    tourScrollY = 0;
    tourRounds = [];

    // Filter only selected teams
    let chosenTeams = [];
    for (let i = 0; i < TOURNAMENT_PRESET_TEAMS.length; i++) {
        if (selectedTourTeams[i]) {
            chosenTeams.push(TOURNAMENT_PRESET_TEAMS[i]);
        }
    }

    let shuffled = shuffle([...chosenTeams]);
    tourTeams = shuffled;

    let firstRoundMatches = [];
    for (let i = 0; i < teamCount; i += 2) {
        firstRoundMatches.push({
            t1: tourTeams[i],
            t2: tourTeams[i+1],
            score1: 0,
            score2: 0,
            played: false
        });
    }
    tourRounds.push(firstRoundMatches);
    gameState = 'TOUR_BRACKET';
}

function initTournament(teamCount) {
    isTournament = true;

    gameState = 'TOUR_BRACKET';
}

function handleGameLogic() {
    let isAnyMoving = false;
    if (typeof entities !== 'undefined' && entities) {
        for (let e of entities) {
            if (e.v && e.v.mag() > 0.05) {
                isAnyMoving = true;
                break;
            }
        }
    }

    let shouldRecordFrame = (gameState === 'GAME' && !isEditingTactic && !isResettingPositions && !isEvacuating && !matchWinner && !isCoinTossActive && !isReplaying);
    if (isGoalCelebrating && postGoalFramesToRecord <= 0) {
        shouldRecordFrame = false;
    }

    if (shouldRecordFrame) {
        if (!wasMovingLastFrame && isAnyMoving) {
            prevShotFrameIndex = lastShotFrameIndex;
            lastShotFrameIndex = frameHistory.length;
            wasBallInCornerBeforeShot = isBallInCorner();
        }
        wasMovingLastFrame = isAnyMoving;

        if (isAnyMoving || postGoalFramesToRecord > 0) {
            let frameData = entities.map(e => ({
                x: e.p.x,
                y: e.p.y,
                isBall: e.isBall,
                color: e.color,
                d: e.d
            }));
            frameHistory.push(frameData);
            if (frameHistory.length > MAX_HISTORY_FRAMES) {
                frameHistory.shift();
                prevShotFrameIndex = Math.max(0, prevShotFrameIndex - 1);
                lastShotFrameIndex = Math.max(0, lastShotFrameIndex - 1);
            }
        }
        
        if (postGoalFramesToRecord > 0) {
            postGoalFramesToRecord--;
            if (postGoalFramesToRecord === 0) {
                let info = pendingGoalInfo;
                if (info) {
                    let replayCopy = recordGoalEvent(info.scoringTeam, info.isAutoGoal);
                    
                    let isP1Win = (p1Goals >= maxGoalsToWin || isGoldenGoalActive) && (info.scoringTeam === PLAYER1_COLOR);
                    let isP2Win = (p2Goals >= maxGoalsToWin || isGoldenGoalActive) && (info.scoringTeam === PLAYER2_COLOR);
                    
                    if (isP1Win || isP2Win) {
                        let winTeamName = isP1Win ? getMatchTeamNameByPlayer(1) : getMatchTeamNameByPlayer(2);
                        pendingWinTeamName = winTeamName;
                        let started = startInstantReplay(replayCopy, 'GAME_WIN');
                        if (!started) {
                            triggerWin(winTeamName);
                        }
                    } else {
                        let started = startInstantReplay(replayCopy, 'GAME');
                        if (!started) {
                            goalCelebrationTimer = 0;
                            goalTextTimer = 0;
                        }
                    }
                    pendingGoalInfo = null;
                }
            }
        }
    }

    orbitAngle += 0.04; 

    if (globalSpawnAlpha < 255) {
        globalSpawnAlpha += 5.5; if (globalSpawnAlpha > 255) globalSpawnAlpha = 255;
    }

    if (isGoalCelebrating) {
        goalCelebrationTimer--;
        if (goalCelebrationTimer <= 0) {
            isGoalCelebrating = false;
            if (isVsBot && !isCampaign && !isTournament && TACTICS[p2TacticIdx] !== 'СВОЯ') p2TacticIdx = floor(random(0, 4));
            animateFieldToTactic(pendingNextTurnTeam); 
        }
    }

    if (isResettingPositions || isEvacuating) {
        let arrivedCount = 0;
        for (let i = 0; i < entities.length; i++) {
            let targetPos = targetPositions[i];
            if (targetPos) {
                entities[i].p.x = lerp(entities[i].p.x, targetPos.x, 0.08); 
                entities[i].p.y = lerp(entities[i].p.y, targetPos.y, 0.08);
                if (dist(entities[i].p.x, entities[i].p.y, targetPos.x, targetPos.y) < 0.5) { 
                    entities[i].p.set(targetPos); arrivedCount++; 
                }
            } else { arrivedCount++; }
        }
        if (arrivedCount === entities.length) {
            isResettingPositions = false;
            isEvacuating = false;
            if (isOnline && socket && onlineMyRole === 'PLAYER1') {
                socket.emit('sync', {
                    room: onlineRoomId,
                    positions: entities.map(e => ({
                        x: (e.p.x - fieldX) / fieldW,
                        y: (e.p.y - fieldY) / fieldH
                    }))
                });
            }
        }
    }

    let moving = isDropBallAnimating;
    for (let e of entities) { if (e.v.mag() > 0.05) moving = true; }
    
    if (isCampaign) {
        if (moving) {
            campaignRollingFrameCounter++;
        } else {
            campaignRollingFrameCounter = 0;
        }
    } else {
        campaignRollingFrameCounter = 0;
    }
    
    // Shot Clock and Stalling tracking
    if (isTournament && !matchWinner && !isGoalCelebrating && !isResettingPositions && !isEvacuating && !isEditingTactic && gameState === 'GAME') {
        if (moving) {
            turnShotClock = 15;
            currentTurnIdleTime = 0;
        } else {
            let elapsedSec = deltaTime / 1000;
            currentTurnIdleTime += elapsedSec;
            turnShotClock -= elapsedSec;
            
            if (turnShotClock <= 0) {
                turnShotClock = 15;
                currentTurnIdleTime = 0;
                playSound('over', 0.85);
                currentTurn = (currentTurn === PLAYER1_COLOR) ? PLAYER2_COLOR : PLAYER1_COLOR;
                turnSwitchedThisRoll = true;
                disputedOverlayText = "ХОД ПЕРЕДАН!";
                disputedTextTimer = 110;
                shakeAmount = 4;
            }
        }
    } else {
        turnShotClock = 15;
        currentTurnIdleTime = 0;
    }
    
    if (isTournament && tourTimeLimitMinutes > 0 && !matchWinner && !isGoalCelebrating && !isResettingPositions && !isEvacuating && !isEditingTactic && gameState === 'GAME') {
        if (!moving) {
            let elapsedSec = deltaTime / 1000;
            if (currentTurn === PLAYER1_COLOR) {
                p1TimeRemaining -= elapsedSec;
                if (p1TimeRemaining <= 0) {
                    p1TimeRemaining = 0;
                    playSound('over', 0.9);
                    p2Goals = maxGoalsToWin;
                    let winnerName = getMatchTeamNameByPlayer(2);
                    triggerWin(winnerName);
                }
            } else {
                p2TimeRemaining -= elapsedSec;
                if (p2TimeRemaining <= 0) {
                    p2TimeRemaining = 0;
                    playSound('over', 0.9);
                    p1Goals = maxGoalsToWin;
                    let winnerName = getMatchTeamNameByPlayer(1);
                    triggerWin(winnerName);
                }
            }
        }
    }
    
    if (isTournament && tourMatchDurationMinutes > 0 && matchTimeRemaining > 0 && !isGoldenGoalActive && !matchWinner && !isGoalCelebrating && !isResettingPositions && !isEvacuating && !isEditingTactic && gameState === 'GAME') {
        let elapsedSec = deltaTime / 1000;
        // Pause the match timer if the current turn has been idle for more than 6.0 seconds to prevent stalling
        if (currentTurnIdleTime <= 6.0) {
            matchTimeRemaining -= elapsedSec;
        }
        if (matchTimeRemaining <= 0) {
            matchTimeRemaining = 0;
            if (p1Goals !== p2Goals) {
                let winnerName = (p1Goals > p2Goals) ? getMatchTeamNameByPlayer(1) : getMatchTeamNameByPlayer(2);
                playSound('over', 0.9);
                triggerWin(winnerName);
            } else {
                isGoldenGoalActive = true;
                playSound('over', 0.9);
                disputedOverlayText = "ЗОЛОТОЙ ГОЛ!";
                disputedTextTimer = 180;
                shakeAmount = 8;
            }
        }
    }
    
    if (moving || isResettingPositions || isEvacuating || matchWinner || isEditingTactic || isGoalCelebrating || isCoinTossActive) {
        orbitAlpha = 0; 
    } else {
        orbitAlpha = lerp(orbitAlpha, 255, 0.08); 
    }

    if (!moving && !isResettingPositions && !isEvacuating && turnSwitchedThisRoll && !matchWinner && !isEditingTactic && !isGoalCelebrating) {
        triggerSmoothEvacuation();
        turnSwitchedThisRoll = false; 
        if (isKickOffActive) {
            isKickOffActive = false;
            createShieldDeactivationSparkles();
        }
        
        if (enableCoinToss && isBallInCorner()) {
            if (wasBallInCornerBeforeShot) {
                cornerTurns++;
                if (cornerTurns >= 2) {
                    triggerDropBall();
                }
            } else {
                cornerTurns = 0;
            }
        } else {
            cornerTurns = 0;
        }

        if (isOnline && socket && myShotPendingResolve) {
            myShotPendingResolve = false;
            socket.emit('sync', {
                room: onlineRoomId,
                cornerTurns: cornerTurns,
                positions: entities.map(e => ({
                    x: (e.p.x - fieldX) / fieldW,
                    y: (e.p.y - fieldY) / fieldH
                }))
            });
        }
    }

function getVibrantTurnBgColor(hexColor) {
    if (!hexColor) return color(ORIGINAL_BG);
    let c = color(hexColor);
    let r = red(c);
    let g = green(c);
    let b = blue(c);
    let bgR = map(r, 0, 255, 25, 185);
    let bgG = map(g, 0, 255, 25, 185);
    let bgB = map(b, 0, 255, 25, 185);
    return color(bgR, bgG, bgB);
}

    if (matchWinner) {
        let winColor = (p1Goals > p2Goals) ? PLAYER1_COLOR : PLAYER2_COLOR;
        animatedBgColor = color(winColor); 
    } else if (isGoalCelebrating && goalScoringTeamColor) {
        let targetGoalBg = (goalScoringTeamColor === PLAYER1_COLOR) ? color('#3a1515') : color('#15363a');
        animatedBgColor = lerpColor(animatedBgColor, targetGoalBg, 0.15);
    } else if (isEditingTactic) {
        animatedBgColor = color('#1e2528'); 
    } else if (moving || isResettingPositions || isEvacuating || isCoinTossActive) {
        animatedBgColor = lerpColor(animatedBgColor, color(ORIGINAL_BG), 0.08);
    } else {
        let turnBg = getVibrantTurnBgColor(currentTurn);
        animatedBgColor = lerpColor(animatedBgColor, turnBg, 0.06);
    }
    
    background(animatedBgColor);

    if (!matchWinner && !isGoalCelebrating) {
        targetFieldScale = 1.0;
    }
    fieldScale = lerp(fieldScale, targetFieldScale, 0.08);

    push();
    translate(width / 2, height / 2); scale(fieldScale); translate(-width / 2, -height / 2);

    drawVisualLayout(); 
    drawModifiers(); 
    if (isCampaign && !isEditingTactic) {
        updateAndDrawMines();
        updateAndDrawPortals();
        updateAndDrawVortices();
    } 
    if (!isEditingTactic && !matchWinner && !isGoalCelebrating) {
        drawCornerIndicators();
        updateDropBallAnimation();
    }
    drawBallTrail(); 
    if (!isResettingPositions && !isEvacuating && !isEditingTactic && !matchWinner && !isGoalCelebrating) checkCollisions();

    if (isVsBot && currentTurn === PLAYER2_COLOR && !moving && !isResettingPositions && !isEvacuating && !matchWinner && !isEditingTactic && !isGoalCelebrating && !isCoinTossActive) {
        aiTimer++; if (aiTimer > 75) { executeBotTurn(); aiTimer = 0; }
    }

    if (selectedChip && mouseIsPressed && !isEditingTactic && !matchWinner && !isGoalCelebrating) { targetAimAlpha = 50; lastSelectedChipPos = selectedChip.p.copy(); } 
    else { targetAimAlpha = 0; }
    aimAlpha = lerp(aimAlpha, targetAimAlpha, 0.12); 
    if (aimAlpha > 0.5 && lastSelectedChipPos) drawOriginalPull(lastSelectedChipPos);

    for (let e of entities) { 
        let shouldUpdatePhysics = !isEditingTactic && !isResettingPositions && !isEvacuating && !matchWinner && !isCoinTossActive;
        if (isGoalCelebrating && postGoalFramesToRecord <= 0) {
            shouldUpdatePhysics = false;
        }
        if (shouldUpdatePhysics) e.update(); 
        if (e.checkGoal()) { pop(); return; } 
        e.display(moving); 
    }
    
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(); if (particles[i].alpha <= 0) particles.splice(i, 1); else particles[i].display();
    }
    
    drawCollisionDebugOverlay();

    if (isEditingTactic) { drawSaveButtonsOverlay(); } else { drawFieldScore(); }
    pop(); 

    drawCollisionToggleButton(); 

    if (isCampaign && gameState === 'GAME' && !matchWinner) {
        push(); textAlign(LEFT, TOP); fill(255, 170); textSize(14); textStyle(BOLD);
        text(`УРОВЕНЬ: ${CAMPAIGN_LEVELS[currentLevel].name}`, fieldX + 10, fieldY - goalH - 25);
        pop();
    }
    else if (isTournament && gameState === 'GAME' && !matchWinner) {
        push(); textAlign(CENTER, TOP); fill(255, 170); textSize(12); textStyle(BOLD);

    if (matchWinner) {

        if (goalTextTimer === 0) {
            postMatchWinnerName = matchWinner;
            changeStateWithFade('MATCH_RESULTS');
        }
    } else if (isGoalCelebrating && goalTextTimer > 0) {

    if (disputedTextTimer > 0) {

    }

    drawCoinTossOverlay();

function handleMatchEnd(winnerName) {
    ballTrail = []; fastTrails = []; isEditingTactic = false; matchWinner = null; isGoalCelebrating = false;
    fieldScale = 1.0; targetFieldScale = 1.0; globalSpawnAlpha = 255; goalW = defaultGoalW;   
    
    if (isCampaign) {
        if (p1Goals > p2Goals) { 
            let earnedStars = 1;
            if (p2Goals === 0) earnedStars = 3;
            else if (p2Goals === 1) earnedStars = 2;
            
            setCampaignLevelStars(currentLevel, earnedStars);
            
            if (currentLevel === campaignHighestUnlocked) {
                campaignHighestUnlocked = min(currentLevel + 1, CAMPAIGN_LEVELS.length - 1);
                saveCampaignProgress();
            }
        }
        gameState = 'CAMPAIGN_SELECT';
        isCampaign = false;
        entities = [];
    } 
    else if (isTournament) {
        let currentRound = tourRounds[currentRoundIdx];
        let match = currentRound[currentMatchIdx];
        match.played = true;
        match.score1 = p1Goals;
        match.score2 = p2Goals;
        match.goals = [...scoredGoalsList];

        currentMatchIdx++;
        if (currentMatchIdx >= currentRound.length) {
            let isEndOfTournament = false;
            let finalMatch = currentRound.find(m => m.isFinal);
            
            if (finalMatch || currentRound.length === 1) {
                isEndOfTournament = true;
            }

            if (isEndOfTournament) {
                let actualFinal = finalMatch || currentRound[0];
                let firstPlaceTeam = (actualFinal.score1 > actualFinal.score2) ? actualFinal.t1 : actualFinal.t2;
                let secondPlaceTeam = (actualFinal.score1 > actualFinal.score2) ? actualFinal.t2 : actualFinal.t1;
                
                let thirdPlaceTeam = null;
                let thirdMatch = currentRound.find(m => m.isThirdPlace);
                if (thirdMatch) {
                    thirdPlaceTeam = (thirdMatch.score1 > thirdMatch.score2) ? thirdMatch.t1 : thirdMatch.t2;
                }
                
                tourPodiumResults = {
                    first: firstPlaceTeam,
                    second: secondPlaceTeam,
                    third: thirdPlaceTeam
                };
                
                gameState = 'TOUR_VICTORY_CEREMONY';
                for (let i = 0; i < 120; i++) {
                    createCelebrationConfetti();
                }
                entities = [];
            } else if (currentRound.length === 2) {
                let l1 = (currentRound[0].score1 > currentRound[0].score2) ? currentRound[0].t2 : currentRound[0].t1;
                let l2 = (currentRound[1].score1 > currentRound[1].score2) ? currentRound[1].t2 : currentRound[1].t1;
                let w1 = (currentRound[0].score1 > currentRound[0].score2) ? currentRound[0].t1 : currentRound[0].t2;
                let w2 = (currentRound[1].score1 > currentRound[1].score2) ? currentRound[1].t1 : currentRound[1].t2;
                
                let nextRoundMatches = [];
                nextRoundMatches.push({ t1: l1, t2: l2, score1: 0, score2: 0, played: false, isThirdPlace: true });
                nextRoundMatches.push({ t1: w1, t2: w2, score1: 0, score2: 0, played: false, isFinal: true });
                
                tourRounds.push(nextRoundMatches);
                currentRoundIdx++;
                currentMatchIdx = 0;

            } else {

                    let w2 = (currentRound[i+1].score1 > currentRound[i+1].score2) ? currentRound[i+1].t1 : currentRound[i+1].t2;
                    nextRoundMatches.push({ t1: w1, t2: w2, score1: 0, score2: 0, played: false });
                }
                tourRounds.push(nextRoundMatches);
                currentRoundIdx++;
                currentMatchIdx = 0;
                viewRoundIdx = currentRoundIdx;
                gameState = 'TOUR_BRACKET';
            }
        } else {
            gameState = 'TOUR_BRACKET';
        }
    }
    else { 
        if (isOnline) {
            gameState = 'ONLINE_LOBBY';
            onlineP1Ready = false;
            onlineP2Ready = false;
            entities = [];
            if (socket) {
                socket.emit('rematch', { room: onlineRoomId });
            }

    }
}

    } 
    else if (botDifficulty === 'СРЕДНЕ') {

        let pushVec = p5.Vector.sub(ball.p, chosenChip.p);

    else if (botDifficulty === 'СЛОЖНО') {

function triggerSmoothEvacuation() {
    let penaltyH = fieldH * 0.11; let goalLeftX = (fieldX + fieldW/2) - goalW/2; let goalRightX = (fieldX + fieldW/2) + goalW/2;
    targetPositions = []; let needsEvac = false;
    for (let i = 0; i < entities.length; i++) {
        let e = entities[i]; targetPositions.push(e.p.copy());
        if (!e.isBall) {
            let r = e.d / 2;
            if (e.p.x > goalLeftX - 2 && e.p.x < goalRightX + 2) {
                if (e.p.y < fieldY + 2) {
                    let flankX = (e.p.x < fieldX + fieldW/2) ? (fieldX + fieldW/2 - goalW*0.65) : (fieldX + fieldW/2 + goalW*0.65);
                    let targetY = fieldY + penaltyH + r + 6;
                    
                    let attempt = 0;
                    let finalX = flankX;
                    let finalY = targetY;
                    let occupied = true;
                    while (occupied && attempt < 10) {
                        occupied = false;
                        for (let j = 0; j < i; j++) {
                            if (!entities[j].isBall && dist(finalX, finalY, targetPositions[j].x, targetPositions[j].y) < e.d + 5) {
                                occupied = true;
                                break;
                            }
                        }
                        if (occupied) {
                            finalX += random(-25, 25);
                            finalY += random(15, 30);
                            attempt++;
                        }
                    }
                    targetPositions[i].set(finalX, finalY); e.v.set(0, 0); needsEvac = true;
                }
                if (e.p.y > fieldY + fieldH - 2) {
                    let flankX = (e.p.x < fieldX + fieldW/2) ? (fieldX + fieldW/2 - goalW*0.65) : (fieldX + fieldW/2 + goalW*0.65);
                    let targetY = fieldY + fieldH - penaltyH - r - 6;
                    
                    let attempt = 0;
                    let finalX = flankX;
                    let finalY = targetY;
                    let occupied = true;
                    while (occupied && attempt < 10) {
                        occupied = false;
                        for (let j = 0; j < i; j++) {
                            if (!entities[j].isBall && dist(finalX, finalY, targetPositions[j].x, targetPositions[j].y) < e.d + 5) {
                                occupied = true;
                                break;
                            }
                        }
                        if (occupied) {
                            finalX += random(-25, 25);
                            finalY -= random(15, 30);
                            attempt++;
                        }
                    }
                    targetPositions[i].set(finalX, finalY); e.v.set(0, 0); needsEvac = true;
                }
            }
        }
    }
    if (needsEvac) isEvacuating = true;
}

    let midY = fieldY + fieldH / 2;

        let isMinesLevelOnly = (lvl.scenario === 'mines');
        if (isMinesLevelOnly) {
            // Spawn 4 mines in symmetrical layout for the pure Mines level
            campaignMines.push({ x: midX - fieldW * 0.22, y: midY - fieldH * 0.16, size: 24, triggered: false, triggerCooldown: 0, pulse: 0 });
            campaignMines.push({ x: midX + fieldW * 0.22, y: midY - fieldH * 0.16, size: 24, triggered: false, triggerCooldown: 0, pulse: PI/2 });

        } else {
            // Nerfed to 2 mines for Chaos and Royale, placed safely on left/right outer boundaries to not disrupt kickoff
            campaignMines.push({ x: fieldX + 38, y: midY - fieldH * 0.12, size: 22, triggered: false, triggerCooldown: 0, pulse: 0 });
            campaignMines.push({ x: fieldX + fieldW - 38, y: midY + fieldH * 0.12, size: 22, triggered: false, triggerCooldown: 0, pulse: PI });
        }
    }

    if (lvl.scenario === 'vortex' || lvl.scenario === 'royale') {
        // Gravitational Vortex in the center of the pitch - nerfed pull strength to keep playability high
        let str = (lvl.scenario === 'royale') ? 0.05 : 0.08;

    }

    if (lvl.scenario === 'portals' || lvl.scenario === 'royale') {

            color: '#00e5ff',

    }
}

function updateAndDrawMines() {
    let mineCol = '#ff1744';
    
    for (let mine of campaignMines) {
        if (mine.triggerCooldown > 0) {
            mine.triggerCooldown--;
            if (mine.triggerCooldown === 0) {
                mine.triggered = false;
            }
        }
        
        mine.pulse += 0.08;
        
        push();
        if (mine.triggered) {
            stroke('#424242');
            strokeWeight(1.5);
            fill('#212121');
            ellipse(mine.x, mine.y, mine.size);
            
            noFill();
            stroke('#888888');
            strokeWeight(1);
            let rechargeArc = map(mine.triggerCooldown, 0, 180, 0, TWO_PI);
            arc(mine.x, mine.y, mine.size - 6, mine.size - 6, -HALF_PI, -HALF_PI + rechargeArc);
        } else {
            let glowSize = mine.size + 6 * sin(mine.pulse);
            noStroke();
            fill(color(255, 23, 68, 50 + 15 * sin(mine.pulse)));
            ellipse(mine.x, mine.y, glowSize * 1.5);
            
            stroke('#1a0003');
            strokeWeight(2);
            fill(mineCol);
            ellipse(mine.x, mine.y, mine.size);
            
            fill(255);
            noStroke();
            ellipse(mine.x, mine.y, mine.size * 0.4);
            
            stroke('#ff1744');
            strokeWeight(2.5);
            for (let a = 0; a < TWO_PI; a += PI/4) {

            for (let ent of entities) {
                if (isResettingPositions || isEvacuating || isGoalCelebrating || isKickOffActive) continue;
                let d = dist(ent.p.x, ent.p.y, mine.x, mine.y);
                let minDist = ent.d/2 + mine.size/2;
                if (d < minDist) {
                    mine.triggered = true;
                    mine.triggerCooldown = 180;
                    
                    let forceDir = p5.Vector.sub(ent.p, createVector(mine.x, mine.y));
                    if (forceDir.mag() < 0.1) forceDir = p5.Vector.random2D();
                    forceDir.normalize().mult(random(14, 20));
                    ent.v.add(forceDir);
                    
                    shakeAmount = 15;
                    triggerVibrate(60);
                    playSound('wall', 1.8);
                    
                    for (let i = 0; i < 20; i++) {
                        let pColor = random() > 0.4 ? '#ff5722' : '#ffea00';
                        particles.push(new Particle(mine.x + random(-5, 5), mine.y + random(-5, 5), pColor, 1.8));
                    }
                    break;
                }
            }
        }
        pop();
    }
}

function updateAndDrawPortals() {
    for (let portal of campaignPortals) {
        portal.pulse += 0.05;
        
        push();
        noStroke();
        let glowSize = portal.size + 10 * sin(portal.pulse * 2);
        let c = color(portal.color);
        c.setAlpha(40 + 15 * sin(portal.pulse));
        fill(c);
        ellipse(portal.x, portal.y, glowSize * 1.5);
        
        noFill();
        stroke(portal.color);
        strokeWeight(3.5 + 1.5 * sin(portal.pulse));
        ellipse(portal.x, portal.y, portal.size);
        
        fill('#000000');
        stroke(portal.color);
        strokeWeight(1);
        ellipse(portal.x, portal.y, portal.size - 6);
        
        push();
        translate(portal.x, portal.y);
        rotate(portal.pulse * 3);
        stroke(portal.color);
        strokeWeight(2.5);
        for (let i = 0; i < 4; i++) {
            let angle = i * HALF_PI;
            point(cos(angle) * (portal.size/2 - 6), sin(angle) * (portal.size/2 - 6));
        }
        pop();
        pop();
        
        for (let [ent, cd] of portal.cooldowns.entries()) {
            if (cd > 0) {
                portal.cooldowns.set(ent, cd - 1);
            } else {
                portal.cooldowns.delete(ent);
            }
        }
        
        for (let ent of entities) {
            if (isResettingPositions || isEvacuating || isGoalCelebrating) continue;
            let d = dist(ent.p.x, ent.p.y, portal.x, portal.y);
            if (d < portal.size/2 + ent.d/4) {
                if (!portal.cooldowns.has(ent)) {
                    ent.p.x = portal.targetX;
                    ent.p.y = portal.targetY;
                    
                    for (let i = 0; i < 15; i++) {
                        particles.push(new Particle(portal.x, portal.y, portal.color, 1.2));
                        particles.push(new Particle(portal.targetX, portal.targetY, portal.color, 1.2));
                    }
                    
                    playSound('wall', 0.85);
                    triggerVibrate(30);
                    
                    for (let pEnd of campaignPortals) {
                        pEnd.cooldowns.set(ent, 120);
                    }
                }
            }
        }
    }
}

function updateAndDrawVortices() {
    for (let v of campaignVortices) {
        v.pulse += 0.04;
        
        push();
        noFill();
        strokeWeight(1.5);
        let waveCount = 3;
        for (let i = 0; i < waveCount; i++) {
            let r = ((v.pulse * 40 + i * (v.radius / waveCount)) % v.radius);
            let alpha = map(r, 0, v.radius, 140, 0);
            stroke(30, 144, 255, alpha);
            ellipse(v.x, v.y, r * 2);
        }
        
        noStroke();
        fill('#000000');
        ellipse(v.x, v.y, 22);
        
        noFill();
        stroke('#ff9100');
        strokeWeight(3);
        ellipse(v.x, v.y, 28 + 4 * sin(v.pulse * 5));
        pop();
        
        if (campaignRollingFrameCounter > 210) continue; // Stop applying pull after 3.5 seconds to prevent infinite loops!

        for (let ent of entities) {
            if (isResettingPositions || isEvacuating || isGoalCelebrating) continue;
            let d = dist(ent.p.x, ent.p.y, v.x, v.y);
            if (d < v.radius && d > 10) {
                let pullDir = createVector(v.x - ent.p.x, v.y - ent.p.y).normalize();
                let forceStrength = map(d, 0, v.radius, v.pullStrength, v.pullStrength * 0.1);
                ent.v.add(pullDir.mult(forceStrength));
            }
        }
    }
}

function spawnTeamToPositions(teamColor, tacticName, isTop, arrayToPush) {
    let centerX = fieldX + fieldW / 2; 
    let chipD = fieldW * 0.096;
    let lvl = isCampaign ? CAMPAIGN_LEVELS[currentLevel] : null;
    if (isCampaign && lvl && lvl.scenario === 'titans' && isTop) {
        chipD = fieldW * 0.145; // Opponent titans are bigger and heavier!
    }
    let tempPositions = [];
    
    function getHorizontalCoordsForCount(count, lineY) {
        let coords = [];
        if (count === 1) {
            coords.push(createVector(centerX, lineY));
        } else if (count === 2) {
            coords.push(createVector(centerX - fieldW * 0.165, lineY));
            coords.push(createVector(centerX + fieldW * 0.165, lineY));
        } else if (count === 3) {
            coords.push(createVector(centerX, lineY));
            coords.push(createVector(centerX - fieldW * 0.21, lineY));
            coords.push(createVector(centerX + fieldW * 0.21, lineY));
        } else if (count === 4) {
            coords.push(createVector(centerX - fieldW * 0.26, lineY));
            coords.push(createVector(centerX - fieldW * 0.09, lineY));
            coords.push(createVector(centerX + fieldW * 0.09, lineY));
            coords.push(createVector(centerX + fieldW * 0.26, lineY));
        } else if (count === 5) {
            coords.push(createVector(centerX, lineY));
            coords.push(createVector(centerX - fieldW * 0.135, lineY));
            coords.push(createVector(centerX + fieldW * 0.135, lineY));
            coords.push(createVector(centerX - fieldW * 0.27, lineY));
            coords.push(createVector(centerX + fieldW * 0.27, lineY));
        }
        return coords;
    }

    if (isTournament) {
        tacticName = 'РАНДОМ';
    }

    if (tacticName === 'СВОЯ') {
        let savedPositions = isTop ? p2CustomPositions : p1CustomPositions;
        if (savedPositions.length === 0) tacticName = 'БАЛАНС';
        else {
            for (let offset of savedPositions) {
                let ox = (abs(offset.x) <= 2) ? offset.x * fieldW : offset.x;
                let oy = (abs(offset.y) <= 2) ? offset.y * fieldH : offset.y;
                tempPositions.push(createVector(centerX + ox, (fieldY + fieldH/2) + oy));
            }
        }
    }

    if (isOnline) {
        let hasCustom = isTop ? (p2Saved && p2CustomPositions.length > 0) : (p1Saved && p1CustomPositions.length > 0);
        if (hasCustom && tacticName === 'СВОЯ') {
            tempPositions = [];
            let savedPositions = isTop ? p2CustomPositions : p1CustomPositions;
            for (let offset of savedPositions) {
                let ox = (abs(offset.x) <= 2) ? offset.x * fieldW : offset.x;
                let oy = (abs(offset.y) <= 2) ? offset.y * fieldH : offset.y;
                tempPositions.push(createVector(centerX + ox, (fieldY + fieldH/2) + oy));
            }
        } else if (!hasCustom && tacticName !== 'СВОЯ') {
            tacticName = 'БАЛАНС';
        }
    }

    if (tacticName !== 'СВОЯ') {
        let partition = [1, 2, 2]; // GK/Def, Mid, Att
        
        if (tacticName === 'БАЛАНС') {
            if (isEditingTactic || isOnline) {
                partition = [1, 2, 2];
            } else {
                let subTactics = [
                    [1, 2, 2],
                    [2, 1, 2],
                    [1, 3, 1],
                    [2, 2, 1]
                ];
                partition = random(subTactics);
            }
        } else if (tacticName === 'АТАКА') {
            let subTactics = [
                [1, 1, 3],
                [0, 2, 3],
                [1, 0, 4],
                [2, 0, 3]
            ];
            partition = random(subTactics);
        } else if (tacticName === 'ЗАЩИТА') {
            let subTactics = [
                [3, 1, 1],
                [3, 2, 0],
                [4, 1, 0],
                [4, 0, 1]
            ];
            partition = random(subTactics);
        } else if (tacticName === 'РАНДОМ') {
            let bins = [0, 0, 0];
            for (let i = 0; i < 5; i++) {
                bins[floor(random(0, 3))]++;
            }
            partition = bins;
        }
        
        let defenders = partition[0];
        let midfielders = partition[1];
        let attackers = partition[2];
        
        // Define Y positions for the 3 lines (proportional to field height)
        let defY, midY, attY;
        if (isTop) {
            defY = fieldY + fieldH * 0.09;
            midY = fieldY + fieldH * 0.22;
            attY = fieldY + fieldH * 0.37;
        } else {
            defY = fieldY + fieldH - fieldH * 0.09;
            midY = fieldY + fieldH - fieldH * 0.22;
            attY = fieldY + fieldH - fieldH * 0.37;
        }
        
        // Defense line
        let defCoords = getHorizontalCoordsForCount(defenders, defY);
        for (let p of defCoords) tempPositions.push(p);
        
        // Midfield line
        let midCoords = getHorizontalCoordsForCount(midfielders, midY);
        for (let p of midCoords) tempPositions.push(p);
        
        // Attack line
        let attCoords = getHorizontalCoordsForCount(attackers, attY);
        for (let p of attCoords) tempPositions.push(p);
    }

    if (arrayToPush) { for(let pos of tempPositions) arrayToPush.push(pos); } 
    else { for(let pos of tempPositions) entities.push(new Entity(pos.x, pos.y, chipD, teamColor, false)); }
}

function checkCollisions() {
    for (let i = 0; i < entities.length; i++) {
        for (let j = i + 1; j < entities.length; j++) {
            let e1 = entities[i]; e2 = entities[j];
            let dx = e2.p.x - e1.p.x; let dy = e2.p.y - e1.p.y;
            let distSq = dx * dx + dy * dy; let minDist = (e1.d + e2.d) / 2;
            if (distSq < minDist * minDist) {
                let d = sqrt(distSq); 
                let normalX, normalY;
                if (d < 0.1) {
                    let angle = random(TWO_PI);
                    normalX = cos(angle);
                    normalY = sin(angle);
                    d = 0.1;
                } else {
                    normalX = dx / d;
                    normalY = dy / d;
                }
                let overlap = minDist - d;
                e1.p.x -= normalX * (overlap / 2); e1.p.y -= normalY * (overlap / 2);
                e2.p.x += normalX * (overlap / 2); e2.p.y += normalY * (overlap / 2);
                let vx = e2.v.x - e1.v.x; let vy = e2.v.y - e1.v.y; let vNormal = vx * normalX + vy * normalY;
                if (vNormal < 0) {
                    let totalMass = e1.mass + e2.mass; let impulse = (1.8 * vNormal) / totalMass; let strikeIntensity = abs(vNormal);
                    e1.v.x += impulse * e2.mass * normalX; e1.v.y += impulse * e2.mass * normalY;
                    e2.v.x -= impulse * e1.mass * normalX; e2.v.y -= impulse * e1.mass * normalY;
                    
                    let vTangent = (e2.v.x - e1.v.x) * (-normalY) + (e2.v.y - e1.v.y) * normalX;
                    let rotImpulse = vTangent * 0.08 + (random() - 0.5) * strikeIntensity * 0.09;
                    e1.angularVel += rotImpulse;
                    e2.angularVel -= rotImpulse;

                    if (e1.isBall && !e2.isBall) lastTouchColor = e2.color;
                    if (e2.isBall && !e1.isBall) lastTouchColor = e1.color;
                    if (strikeIntensity > 1.8) {
                        let now = millis();
                        if (now - lastHitSoundTime > 35) {
                            lastHitSoundTime = now;
                            playSound('hit', strikeIntensity / 7);
                        }
                        triggerVibrate(20);
                    }
                    let sparkColor = e1.v.magSq() > e2.v.magSq() ? e1.color : e2.color;
                    if (strikeIntensity > 1.5 && particles.length < 120) {
                        createSparks((e1.p.x + e2.p.x)/2, (e1.p.y + e2.p.y)/2, sparkColor, strikeIntensity);
                    }
                }
            }
        }
    }
}

function drawOriginalPull(chipPos) {
    let anchor = (dragAnchor && selectedChip) ? dragAnchor : chipPos;
    let isOffsetAnchor = dist(anchor.x, anchor.y, chipPos.x, chipPos.y) > 10;
    let originVec = isOffsetAnchor ? anchor : chipPos;
    let mousePos = createVector(mouseX, mouseY); 
    
    if (isOffsetAnchor) {
        push();
        stroke('rgba(88, 166, 255, 0.6)');
        strokeWeight(2);
        drawingContext.setLineDash([4, 4]);
        line(chipPos.x, chipPos.y, anchor.x, anchor.y);
        drawingContext.setLineDash([]);
        
        fill('rgba(88, 166, 255, 0.2)');
        stroke('#58a6ff');
        strokeWeight(2);
        ellipse(anchor.x, anchor.y, 38, 38);
        
        fill('#58a6ff');
        noStroke();
        ellipse(anchor.x, anchor.y, 8, 8);
        
        textAlign(CENTER, CENTER);
        textSize(9);
        textStyle(BOLD);
        fill('#58a6ff');
        text("АНКЕР", anchor.x, anchor.y - 25);
        pop();
    }
    
    let pullVec = p5.Vector.sub(mousePos, originVec); 
    let d = pullVec.mag();
    let scaleFactor = (fieldW && fieldW > 0) ? (fieldW / 330) : 1;
    let cancelRadius = 32 * scaleFactor;
    let maxPull = 130 * scaleFactor;
    
    if (d > 3) {
        let isInsideCancelZone = (d <= cancelRadius);

        if (!isInsideCancelZone) {
            let currentPull = min(d, maxPull); 
            let angle = pullVec.heading();

            if (random() < 0.35) {
                let chargeAngle = random(TWO_PI);
                let chargeDist = random(35, 80) * scaleFactor;
                let chargeX = anchor.x + cos(chargeAngle) * chargeDist;
                let chargeY = anchor.y + sin(chargeAngle) * chargeDist;
                let chargeCol = selectedChip ? selectedChip.color : '#ffffff';
                let chargeP = new Particle(chargeX, chargeY, chargeCol, 0.1);
                chargeP.v = createVector(anchor.x - chargeX, anchor.y - chargeY).normalize().mult(random(1.5, 3) * scaleFactor);
                chargeP.alpha = 180;
                chargeP.update = function() {
                    this.p.add(this.v);
                    if (dist(this.p.x, this.p.y, anchor.x, anchor.y) < 15 * scaleFactor) {
                        this.alpha = 0;
                    }
                    this.alpha -= 8;
                };
                particles.push(chargeP);
            }

            // Draw slingshot band at the anchor
            push(); 
            translate(anchor.x, anchor.y); 
            rotate(angle);
            let currentAlpha = map(aimAlpha, 0, 50, 0, 110); 
            fill(0, currentAlpha); 
            noStroke(); 
            ellipse(0, 0, selectedChip ? selectedChip.d * 3.8 : 130 * scaleFactor);
            stroke(255, map(aimAlpha, 0, 50, 0, 140)); 
            strokeWeight(max(2, 5 * scaleFactor)); 
            line(0, 0, currentPull, 0);
            fill(255, map(aimAlpha, 0, 50, 0, 200)); 
            noStroke(); 
            ellipse(currentPull, 0, max(4, 8 * scaleFactor), max(4, 8 * scaleFactor));
            pop();

            // Draw shot trajectory arrow starting directly from the chip
            push();
            translate(chipPos.x, chipPos.y);
            rotate(angle + PI);
            let shootDist = map(currentPull, 0, maxPull, 30 * scaleFactor, 240 * scaleFactor); 
            let baseAlpha = map(aimAlpha, 0, 50, 0, 160);
            let steps = 14;
            for (let i = 0; i < steps; i++) {
                let t1 = i / steps; let t2 = (i + 1) / steps;
                let x1 = t1 * shootDist; let x2 = t2 * shootDist;
                let w1 = map(t1, 0, 1, 12 * scaleFactor, 1 * scaleFactor); let w2 = map(t2, 0, 1, 12 * scaleFactor, 1 * scaleFactor);
                let a1 = map(t1, 0, 1, baseAlpha, 0); let a2 = map(t2, 0, 1, baseAlpha, 0);
                noStroke(); 
                beginShape(); 
                fill(color(255, a1)); vertex(x1, -w1 / 2); 
                fill(color(255, a2)); vertex(x2, -w2 / 2); 
                fill(color(255, a2)); vertex(x2, w2 / 2); 
                fill(color(255, a1)); vertex(x1, w1 / 2); 
                endShape(CLOSE);
            }
            pop();

            // Calculate and draw full predicted trajectory for chip and ball ONLY when showCollisionOverlay and showCollisionBtn are enabled
            if (showCollisionBtn && showCollisionOverlay) {
                let pred = predictPhysicsTrajectory(selectedChip, originVec, mousePos);
                if (pred) {
                    drawPredictedTrajectories(pred);
                }
            }
        }
    }
}

function predictPhysicsTrajectory(chip, origin, mousePos) {
    if (!chip || !chip.p) return null;

    let pullVec = p5.Vector.sub(origin, mousePos);
    let d = pullVec.mag();
    if (d <= 6) return null;

    let scaleFactor = (fieldW && fieldW > 0) ? (fieldW / 330) : 1;
    let maxPull = 130 * scaleFactor;
    let force = pullVec.copy();
    force.limit(maxPull);
    force.mult(STRIKE_POWER);

    if (force.mag() <= 0.05) return null;

    let simEntities = [];
    let simBall = null;
    let simSelected = null;

    let currentLvl = isCampaign ? CAMPAIGN_LEVELS[currentLevel] : null;

    for (let e of entities) {
        let simE = {
            p: e.p.copy(),
            v: e.v.copy(),
            d: e.d,
            mass: e.mass,
            color: e.color,
            isBall: e.isBall,
            isSelected: (e === chip)
        };
        simEntities.push(simE);
        if (e.isBall) simBall = simE;
        if (e === chip) simSelected = simE;
    }

    if (!simSelected || !simBall) return null;

    simSelected.v.add(force);

    let simBallPath = [simBall.p.copy()];
    let simChipPath = [simSelected.p.copy()];
    let bouncePoints = [];
    let firstChipBallHit = null;
    let goalPoint = null;

    let simGoalW = goalW || defaultGoalW || 120;
    let currentTopGoalW = simGoalW;
    let currentBotGoalW = simGoalW;
    if (isCampaign && currentLvl && currentLvl.scenario === 'striker') {
        currentTopGoalW = simGoalW * 0.55;
        currentBotGoalW = simGoalW * 1.45;
    }

    let goalX = fieldX + fieldW / 2;
    let leftPostXTop = goalX - currentTopGoalW / 2;
    let rightPostXTop = goalX + currentTopGoalW / 2;
    let leftPostXBot = goalX - currentBotGoalW / 2;
    let rightPostXBot = goalX + currentBotGoalW / 2;

    let maxSteps = 220;

    for (let step = 0; step < maxSteps; step++) {
        let isMoving = false;
        for (let se of simEntities) {
            if (se.v.mag() > 0.05) { isMoving = true; break; }
        }
        if (!isMoving && step > 0) break;

        // 1. Entity-entity collisions (100% matches game loop order)
        for (let i = 0; i < simEntities.length; i++) {
            for (let j = i + 1; j < simEntities.length; j++) {
                let e1 = simEntities[i];
                let e2 = simEntities[j];
                let dx = e2.p.x - e1.p.x;
                let dy = e2.p.y - e1.p.y;
                let distSq = dx * dx + dy * dy;
                let minDist = (e1.d + e2.d) / 2;

                if (distSq < minDist * minDist) {
                    let dVal = sqrt(distSq);
                    let normalX, normalY;
                    if (dVal < 0.1) {
                        normalX = 1;
                        normalY = 0;
                        dVal = 0.1;
                    } else {
                        normalX = dx / dVal;
                        normalY = dy / dVal;
                    }
                    let overlap = minDist - dVal;

                    e1.p.x -= normalX * (overlap / 2); e1.p.y -= normalY * (overlap / 2);
                    e2.p.x += normalX * (overlap / 2); e2.p.y += normalY * (overlap / 2);

                    let vx = e2.v.x - e1.v.x;
                    let vy = e2.v.y - e1.v.y;
                    let vNormal = vx * normalX + vy * normalY;

                    if (vNormal < 0) {
                        let totalMass = e1.mass + e2.mass;
                        let impulse = (1.8 * vNormal) / totalMass;
                        e1.v.x += impulse * e2.mass * normalX; e1.v.y += impulse * e2.mass * normalY;
                        e2.v.x -= impulse * e1.mass * normalX; e2.v.y -= impulse * e1.mass * normalY;

                        if (!firstChipBallHit && ((e1.isBall && e2 === simSelected) || (e2.isBall && e1 === simSelected))) {
                            let ballE = e1.isBall ? e1 : e2;
                            let chipE = e1.isBall ? e2 : e1;
                            firstChipBallHit = {
                                chipPos: chipE.p.copy(),
                                ballPos: ballE.p.copy(),
                                ballVel: ballE.v.copy(),
                                normal: createVector(normalX, normalY)
                            };
                        }
                    }
                }
            }
        }

        // 2. Movement & boundary/modifier simulation
        for (let se of simEntities) {
            se.p.add(se.v);

            let currentFriction = FRICTION;
            if (isCampaign && currentLvl) {
                if (currentLvl.scenario === 'slalom' || currentLvl.scenario === 'chaos_arena') {
                    currentFriction = 0.982;
                }
            }
            if (isCampaign) {
                activeModifiers.forEach(zone => {
                    if (se.p.x > zone.x && se.p.x < zone.x + zone.w &&
                        se.p.y > zone.y && se.p.y < zone.y + zone.h) {
                        if (zone.type === 'mud') currentFriction = FRICTION * 0.90;
                        if (zone.type === 'ice') currentFriction = 0.985;
                        if (zone.type === 'wind') { se.v.x += zone.forceX; se.v.y += zone.forceY; }
                    }
                });

                // Campaign mine explosion simulation
                if (typeof campaignMines !== 'undefined') {
                    for (let m of campaignMines) {
                        if (!m.triggered) {
                            let dM = dist(se.p.x, se.p.y, m.x, m.y);
                            if (dM < se.d / 2 + m.size / 2) {
                                let fDir = p5.Vector.sub(se.p, createVector(m.x, m.y));
                                if (fDir.mag() < 0.1) fDir = p5.Vector.random2D();
                                fDir.normalize().mult(17);
                                se.v.add(fDir);
                            }
                        }
                    }
                }

                // Campaign portal teleportation simulation
                if (typeof campaignPortals !== 'undefined') {
                    for (let port of campaignPortals) {
                        let dP = dist(se.p.x, se.p.y, port.x, port.y);
                        if (dP < port.size / 2 + se.d / 4) {
                            se.p.x = port.targetX;
                            se.p.y = port.targetY;
                        }
                    }
                }
            }

            se.v.mult(currentFriction);
            if (se.v.mag() < 0.08) se.v.set(0, 0);

            let r = se.d / 2;

            // Goal mouth & net back walls
            if (se.p.y < fieldY) {
                if (se.p.x > leftPostXTop && se.p.x < rightPostXTop) {
                    if (isKickOffActive && se.isBall) {
                        se.p.y = fieldY + r;
                        se.v.y *= -0.8;
                        bouncePoints.push({ x: se.p.x, y: se.p.y, type: 'wall', isBall: se.isBall });
                    } else if (se.p.y < fieldY - goalH + r) {
                        se.p.y = fieldY - goalH + r;
                        se.v.y *= -0.8;
                        bouncePoints.push({ x: se.p.x, y: se.p.y, type: 'wall', isBall: se.isBall });
                    }
                }
            }
            if (se.p.y > fieldY + fieldH) {
                if (se.p.x > leftPostXBot && se.p.x < rightPostXBot) {
                    if (isKickOffActive && se.isBall) {
                        se.p.y = fieldY + fieldH - r;
                        se.v.y *= -0.8;
                        bouncePoints.push({ x: se.p.x, y: se.p.y, type: 'wall', isBall: se.isBall });
                    } else if (se.p.y > fieldY + fieldH + goalH - r) {
                        se.p.y = fieldY + fieldH + goalH - r;
                        se.v.y *= -0.8;
                        bouncePoints.push({ x: se.p.x, y: se.p.y, type: 'wall', isBall: se.isBall });
                    }
                }
            }

            // Goal net side walls
            if (se.p.y < fieldY && se.p.y > fieldY - goalH) {
                if (se.p.x > leftPostXTop - r && se.p.x < rightPostXTop + r) {
                    if (se.p.x < leftPostXTop + r) { se.p.x = leftPostXTop + r; se.v.x *= -0.8; bouncePoints.push({ x: se.p.x, y: se.p.y, type: 'wall', isBall: se.isBall }); }
                    if (se.p.x > rightPostXTop - r) { se.p.x = rightPostXTop - r; se.v.x *= -0.8; bouncePoints.push({ x: se.p.x, y: se.p.y, type: 'wall', isBall: se.isBall }); }
                }
            }
            if (se.p.y > fieldY + fieldH && se.p.y < fieldY + fieldH + goalH) {
                if (se.p.x > leftPostXBot - r && se.p.x < rightPostXBot + r) {
                    if (se.p.x < leftPostXBot + r) { se.p.x = leftPostXBot + r; se.v.x *= -0.8; bouncePoints.push({ x: se.p.x, y: se.p.y, type: 'wall', isBall: se.isBall }); }
                    if (se.p.x > rightPostXBot - r) { se.p.x = rightPostXBot - r; se.v.x *= -0.8; bouncePoints.push({ x: se.p.x, y: se.p.y, type: 'wall', isBall: se.isBall }); }
                }
            }

            // Goal posts
            let collidedPost = false;
            if (se.p.y < fieldY + 15 && se.p.y > fieldY - 15) {
                let dLeft = dist(se.p.x, se.p.y, leftPostXTop, fieldY);
                if (dLeft < r + 4) {
                    let norm = createVector(se.p.x - leftPostXTop, se.p.y - fieldY).normalize();
                    se.p.set(leftPostXTop + norm.x * (r + 4.5), fieldY + norm.y * (r + 4.5));
                    se.v.reflect(norm).mult(0.8);
                    collidedPost = true;
                    bouncePoints.push({ x: se.p.x, y: se.p.y, type: 'post', isBall: se.isBall });
                }
                if (!collidedPost) {
                    let dRight = dist(se.p.x, se.p.y, rightPostXTop, fieldY);
                    if (dRight < r + 4) {
                        let norm = createVector(se.p.x - rightPostXTop, se.p.y - fieldY).normalize();
                        se.p.set(rightPostXTop + norm.x * (r + 4.5), fieldY + norm.y * (r + 4.5));
                        se.v.reflect(norm).mult(0.8);
                        collidedPost = true;
                        bouncePoints.push({ x: se.p.x, y: se.p.y, type: 'post', isBall: se.isBall });
                    }
                }
            }

            let collidedPostBot = false;
            if (se.p.y > fieldY + fieldH - 15 && se.p.y < fieldY + fieldH + 15) {
                let dLeft = dist(se.p.x, se.p.y, leftPostXBot, fieldY + fieldH);
                if (dLeft < r + 4) {
                    let norm = createVector(se.p.x - leftPostXBot, se.p.y - (fieldY + fieldH)).normalize();
                    se.p.set(leftPostXBot + norm.x * (r + 4.5), (fieldY + fieldH) + norm.y * (r + 4.5));
                    se.v.reflect(norm).mult(0.8);
                    collidedPostBot = true;
                    bouncePoints.push({ x: se.p.x, y: se.p.y, type: 'post', isBall: se.isBall });
                }
                if (!collidedPostBot) {
                    let dRight = dist(se.p.x, se.p.y, rightPostXBot, fieldY + fieldH);
                    if (dRight < r + 4) {
                        let norm = createVector(se.p.x - rightPostXBot, se.p.y - (fieldY + fieldH)).normalize();
                        se.p.set(rightPostXBot + norm.x * (r + 4.5), (fieldY + fieldH) + norm.y * (r + 4.5));
                        se.v.reflect(norm).mult(0.8);
                        collidedPostBot = true;
                        bouncePoints.push({ x: se.p.x, y: se.p.y, type: 'post', isBall: se.isBall });
                    }
                }
            }

            // Outer field walls
            let hitWall = false;
            if (se.p.x < fieldX + r) { se.p.x = fieldX + r; se.v.x *= -0.8; hitWall = true; }
            if (se.p.x > fieldX + fieldW - r) { se.p.x = fieldX + fieldW - r; se.v.x *= -0.8; hitWall = true; }
            if (!collidedPost && se.p.y < fieldY + r) {
                if (se.p.x < leftPostXTop || se.p.x > rightPostXTop) { se.p.y = fieldY + r; se.v.y *= -0.8; hitWall = true; }
            }
            if (!collidedPostBot && se.p.y > fieldY + fieldH - r) {
                if (se.p.x < leftPostXBot || se.p.x > rightPostXBot) { se.p.y = fieldY + fieldH - r; se.v.y *= -0.8; hitWall = true; }
            }
            if (hitWall) {
                bouncePoints.push({ x: se.p.x, y: se.p.y, type: 'wall', isBall: se.isBall });
            }

            // Goal detection
            if (se.isBall && !isKickOffActive) {
                if (se.p.y < fieldY - 3 || se.p.y > fieldY + fieldH + 3) {
                    if (!goalPoint) goalPoint = { p: se.p.copy(), isTop: se.p.y < fieldY - 3 };
                }
            }
        }

        // Record precise position at every simulation step for 100% exact rendering
        simChipPath.push(simSelected.p.copy());
        simBallPath.push(simBall.p.copy());

        if (goalPoint) break;
    }

    return {
        chipPath: simChipPath,
        ballPath: simBallPath,
        bouncePoints: bouncePoints,
        firstChipBallHit: firstChipBallHit,
        goalPoint: goalPoint
    };
}

function drawPredictedTrajectories(pred) {
    if (!pred) return;

    push();

    // 1. Selected Chip Trajectory Path (Dashed cyan line with step points)
    if (pred.chipPath && pred.chipPath.length > 1) {
        stroke('rgba(0, 229, 255, 0.85)');
        strokeWeight(2.5);
        drawingContext.setLineDash([6, 6]);
        noFill();
        beginShape();
        for (let pt of pred.chipPath) {
            vertex(pt.x, pt.y);
        }
        endShape();
        drawingContext.setLineDash([]);

        noStroke();
        fill('rgba(0, 229, 255, 0.6)');
        let interval = max(1, floor(pred.chipPath.length / 10));
        for (let i = 0; i < pred.chipPath.length; i += interval) {
            let pt = pred.chipPath[i];
            ellipse(pt.x, pt.y, 4, 4);
        }
    }

    // 2. Ball Predicted Trajectory (Glowing Gold Path)
    if (pred.ballPath && pred.ballPath.length > 1) {
        let isBallMoved = false;
        let startP = pred.ballPath[0];
        let endP = pred.ballPath[pred.ballPath.length - 1];
        if (dist(startP.x, startP.y, endP.x, endP.y) > 2) isBallMoved = true;

        if (isBallMoved) {
            stroke('rgba(255, 215, 0, 0.95)');
            strokeWeight(3.5);
            noFill();
            beginShape();
            for (let pt of pred.ballPath) {
                vertex(pt.x, pt.y);
            }
            endShape();

            noStroke();
            let stepInterval = max(1, floor(pred.ballPath.length / 12));
            for (let i = 0; i < pred.ballPath.length; i += stepInterval) {
                let pt = pred.ballPath[i];
                let alpha = map(i, 0, pred.ballPath.length - 1, 240, 100);
                fill(255, 235, 59, alpha);
                ellipse(pt.x, pt.y, 6, 6);
            }
        }
    }

    // 3. Highlight First Chip-to-Ball Contact Point
    if (pred.firstChipBallHit) {
        let hit = pred.firstChipBallHit;

        push();
        translate(hit.ballPos.x, hit.ballPos.y);
        noFill();
        stroke('#ffea00');
        strokeWeight(2);
        ellipse(0, 0, 28, 28);
        stroke('rgba(255, 234, 0, 0.5)');
        ellipse(0, 0, 36, 36);

        stroke('#ffea00');
        line(-8, 0, 8, 0);
        line(0, -8, 0, 8);

        if (hit.ballVel && hit.ballVel.mag() > 0.1) {
            let dir = hit.ballVel.copy().normalize().mult(28);
            stroke('#00ffcc');
            strokeWeight(2.5);
            line(0, 0, dir.x, dir.y);

            push();
            translate(dir.x, dir.y);
            rotate(dir.heading());
            fill('#00ffcc');
            noStroke();
            triangle(0, 0, -8, -4, -8, 4);
            pop();
        }
        pop();

        push();
        textAlign(CENTER, BOTTOM);
        textSize(10);
        textStyle(BOLD);
        fill('#ffea00');
        noStroke();
        text("УДАР ПО МЯЧУ", hit.ballPos.x, hit.ballPos.y - 20);
        pop();
    }

    // 4. Draw Bounce Impact Circles
    if (pred.bouncePoints) {
        for (let bp of pred.bouncePoints) {
            push();
            noFill();
            let cCol = bp.type === 'post' ? '#ff3d00' : (bp.isBall ? '#ffea00' : '#00e5ff');
            stroke(cCol);
            strokeWeight(2);
            let bd = bp.d || (bp.isBall ? fieldW * 0.0545 : fieldW * 0.106);
            ellipse(bp.x, bp.y, bd, bd);
            fill(cCol);
            ellipse(bp.x, bp.y, 5, 5);
            pop();
        }
    }

    // 5. Draw Goal Scored Path Indicator
    if (pred.goalPoint) {
        let gp = pred.goalPoint;
        push();
        translate(gp.p.x, gp.p.y);

        fill('rgba(0, 230, 118, 0.35)');
        stroke('#00e676');
        strokeWeight(2.5);
        ellipse(0, 0, 38, 38);

        fill('#00e676');
        noStroke();
        textAlign(CENTER, CENTER);
        textSize(11);
        textStyle(BOLD);
        text("ГОЛ!", 0, 0);
        pop();
    }

    pop();
}

function drawCollisionDebugOverlay() {

    }

    let goalX = fieldX + fieldW / 2;
    let leftPostXTop = goalX - topGoalW / 2;
    let rightPostXTop = goalX + topGoalW / 2;
    let leftPostXBot = goalX - botGoalW / 2;
    let rightPostXBot = goalX + botGoalW / 2;

    line(fieldX + rBall, fieldY + rBall, leftPostXTop, fieldY + rBall);

    line(rightPostXBot, fieldY + fieldH - rBall, fieldX + fieldW - rBall, fieldY + fieldH - rBall);
    line(fieldX + rBall, fieldY + rBall, fieldX + rBall, fieldY + fieldH - rBall);
    line(fieldX + fieldW - rBall, fieldY + rBall, fieldX + fieldW - rBall, fieldY + fieldH - rBall);

    stroke('#00e676');
    strokeWeight(2.5);
    line(leftPostXTop, fieldY - 3, rightPostXTop, fieldY - 3);
    line(leftPostXBot, fieldY + fieldH + 3, rightPostXBot, fieldY + fieldH + 3);

    // Post collision radius highlights in debug mode
    let posts = [
        { x: leftPostXTop, y: fieldY },
        { x: rightPostXTop, y: fieldY },
        { x: leftPostXBot, y: fieldY + fieldH },
        { x: rightPostXBot, y: fieldY + fieldH }
    ];
    for (let p of posts) {
        fill('rgba(255, 61, 0, 0.25)');
        stroke('#ff3d00');
        strokeWeight(1.2);
        ellipse(p.x, p.y, 16);
        fill('#ff3d00');
        noStroke();
        ellipse(p.x, p.y, 4);
    }

    for (let e of entities) {
        let r = e.d / 2;
        let isBall = e.isBall;

        push();
        translate(e.p.x, e.p.y);

        noFill();
        stroke(isBall ? '#00e5ff' : '#ffd700');
        strokeWeight(isBall ? 2 : 1.5);
        ellipse(0, 0, e.d);

        stroke(isBall ? '#00e5ff' : '#ffffff');
        strokeWeight(1);
        line(-4, 0, 4, 0);
        line(0, -4, 0, +4);

        if (e.v.mag() > 0.05) {
            let vLine = e.v.copy().mult(12);
            stroke('#ffea00');
            strokeWeight(2);
            line(0, 0, vLine.x, vLine.y);
            fill('#ffea00');
            noStroke();
            ellipse(vLine.x, vLine.y, 4);
        }

        noStroke();
        fill(isBall ? '#00e5ff' : '#ffffff');
        textAlign(CENTER, TOP);
        textSize(8);
        textStyle(BOLD);
        let label = isBall ? `МЯЧ R:${r} M:${e.mass}` : `R:${r} M:${e.mass}`;
        text(label, 0, r + 2);

        pop();
    }

    for (let i = 0; i < entities.length; i++) {
        for (let j = i + 1; j < entities.length; j++) {
            let e1 = entities[i];
            let e2 = entities[j];
            let d = dist(e1.p.x, e1.p.y, e2.p.x, e2.p.y);
            let minDist = (e1.d + e2.d) / 2;

            if (d < minDist + 35) {
                let isColliding = d <= minDist;
                stroke(isColliding ? '#ff1744' : 'rgba(255, 235, 59, 0.7)');
                strokeWeight(isColliding ? 2.5 : 1);
                drawingContext.setLineDash([3, 3]);
                line(e1.p.x, e1.p.y, e2.p.x, e2.p.y);
                drawingContext.setLineDash([]);

                let midX = (e1.p.x + e2.p.x) / 2;
                let midY = (e1.p.y + e2.p.y) / 2;

                if (isColliding) {
                    fill('#ff1744');
                    noStroke();
                    ellipse(midX, midY, 8);
                } else {
                    fill('rgba(0, 0, 0, 0.6)');
                    rectMode(CENTER);
                    noStroke();
                    rect(midX, midY, 40, 12, 3);
                    fill('#ffea00');
                    textAlign(CENTER, CENTER);
                    textSize(7);
                    textStyle(BOLD);
                    text(`${d.toFixed(0)}/${minDist.toFixed(0)}`, midX, midY);
                }
            }
        }
    }

    if (isCampaign) {
        if (typeof campaignMines !== 'undefined') {
            for (let m of campaignMines) {
                noFill();
                stroke('#ff1744');
                strokeWeight(1.5);
                let trigR = m.size / 2 + 18;
                ellipse(m.x, m.y, trigR * 2);
                fill('#ff1744');
                noStroke();
                textSize(8);
                textAlign(CENTER, CENTER);
                text(`МИНА R:${trigR}`, m.x, m.y - trigR - 6);
            }
        }
        if (typeof campaignPortals !== 'undefined') {
            for (let p of campaignPortals) {
                noFill();
                stroke('#d500f9');
                strokeWeight(1.5);
                let portR = p.size / 2 + 9;
                ellipse(p.x, p.y, portR * 2);
            }
        }
    }

    pop();
}
